          type: string
          format: date
        freezeAvailable:
          type: boolean

    AdminBotChannelMetrics:
      type: object
      additionalProperties: true
      required: [configured, linkedActive, linkedTotal, messagesSent, messagesFailed, deliveryRate, remindersSent]
      properties:
        configured:
          type: boolean
        botUsername:
          type: [string, 'null']
        linkedActive:
          type: integer
        linkedTotal:
          type: integer
        linkedInRange:
          type: integer
        unlinkedInRange:
          type: integer
        notificationsDisabled:
          type: integer
        codesCreated:
          type: integer
        codesUsed:
          type: integer
        codeConversion:
          type: number
          description: доля 0…1
        messagesSent:
          type: integer
        messagesFailed:
          type: integer
        messagesSkipped:
          type: integer
        deliveryRate:
          type: number
          description: доля 0…1
        remindersSent:
          type: integer
        lastSentAt:
          type: [string, 'null']
          format: date-time
        lastError:
          type: [string, 'null']

    AdminBotAnalytics:
      type: object
      required: [generatedAt, days, timezone, tablesReady, channels, totals, series, linkFunnel, recentErrors, commands, recap, streak]
      properties:
        generatedAt:
          type: string
          format: date-time
        days:
          type: integer
        timezone:
          type: string
        tablesReady:
          type: boolean
          description: false — миграции ботов ещё не применены
        channels:
          type: object
          required: [telegram, max]
          properties:
            telegram:
              $ref: '#/components/schemas/AdminBotChannelMetrics'
            max:
              $ref: '#/components/schemas/AdminBotChannelMetrics'
        totals:
          type: object
          additionalProperties: true
        series:
          type: array
          items:
            type: object
            required: [day]
            properties:
              day:
                type: string
                format: date
              telegramSent:
                type: integer
              telegramFailed:
                type: integer
              maxSent:
                type: integer
              maxFailed:
                type: integer
        linkFunnel:
          type: object
          required: [codesCreated, codesUsed, conversion]
          properties:
            codesCreated:
              type: integer
            codesUsed:
              type: integer
            conversion:
              type: number
              description: доля 0…1
        recentErrors:
          type: array
          items:
            type: object
            additionalProperties: true
        commands:
          type: array
          items:
            type: object
            additionalProperties: true
        recap:
          type: object
          additionalProperties: true
          description: 'F10: notificationsCreated, delivered, failed, users, telegram, max'
        streak:
          type: object
          additionalProperties: true
          description: 'F10: usersWithStreak, avgCurrentStreak, bestCurrentStreak'

