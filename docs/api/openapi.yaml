        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailMessageRequest'
      responses:
        '200':
          description: письмо отправлено
          content:
            application/json:
              schema:
                type: object
                required: [sent, to]
                properties:
                  sent:
                    type: boolean
                    const: true
                  to:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: почта не настроена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '502':
          description: SMTP не принял письмо
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/admin/mail/broadcasts:
    post:
      tags: [admin]
      operationId: adminCreateMailBroadcast
      summary: Создание почтовой рассылки
      description: |
        Поддерживает `Idempotency-Key` (TTL 24 часа), защиту от дублей, отложенную отправку
        (`scheduledFor`). Отправка выполняется очередью раз в минуту. Лимит — 30 рассылок
        за 10 минут.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]{8,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailBroadcastRequest'
      responses:
        '201':
          description: рассылка создана (в очереди)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '200':
          description: идемпотентный повтор — возвращена существующая рассылка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: такая рассылка уже создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: почта не настроена (для немедленной отправки)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/mail/broadcasts/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [admin]
      operationId: adminCancelMailBroadcast
      summary: Отмена почтовой рассылки
      responses:
        '200':
          description: отменена
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: рассылку нельзя отменить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT сессии или access-токен (httpOnly, Secure, SameSite=None)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "JWT обновления (30 дней), только при `rememberMe: true`"
    guestCookie:
      type: apiKey
      in: cookie
      name: guest_token
      description: Подписанный HMAC гостевой идентификатор

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25

  responses:
    BadRequest:
      description: некорректный запрос (валидация)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: доступ запрещён (нет роли ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ForbiddenOrigin:
      description: запрос с недопустимого origin или без Origin при cookie-сессии
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    PayloadTooLarge:
      description: тело запроса или файл больше допустимого размера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    UnsupportedMediaType:
      description: недопустимый Content-Type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    TooManyRequests:
      description: превышен лимит запросов (rate-limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServiceUnavailable:
      description: зависимость недоступна (ИИ, SMTP, push) или исчерпан бюджет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServerError:
      description: внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ProductEventInput:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum:
            - landing_view
            - register
            - plant_created
            - watering_marked
            - push_subscribed
            - chat_message
            - photo_added
            - plant_id_started
            - plant_id_success
            - share_clicked
        props:
          type: object
          additionalProperties:
            type: [string, number, boolean, 'null']
          description: |
            Плоский объект примитивов. JSON не больше 2048 байт. Запрещены ключи
            `email`, `phone`, `name`, `password`, `token` и их вариации
            (`user_email`, `userEmail`, `auth_token` и т.п.).
        path:
          type: string
          maxLength: 300
          pattern: '^/'

    ProductEventsRequest:
      type: object
      required: [events]
      properties:
        visitorId:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]{8,64}$'
        events:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ProductEventInput'

    ProductEventsAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
          maximum: 20

    NotificationClickResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    UtmSource:
      type: object
      required: [source, medium, campaign, visitors]
      properties:
        source:
          type: string
        medium:
          type: [string, 'null']
        campaign:
          type: [string, 'null']
        visitors:
          type: integer
          minimum: 0
          description: 'Число строк site_visit_days с этой комбинацией UTM за период'

    ProductAnalyticsResponse:
      type: object
      required: [generatedAt, timezone, days, eventsTracked, usersCreatedAtTracked, activity, funnel, retention, events, push, metrics]
      properties:
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
          description: 'IANA-пояс расчёта (Europe/Moscow)'
        days:
          type: integer
          minimum: 1
          maximum: 365
        eventsTracked:
          type: boolean
          description: 'false, если таблицы product_events нет: activity/retention/events нулевые или пустые'
        usersCreatedAtTracked:
          type: boolean
        activity:
          type: object
          required: [dau, wau, mau, activeUsers, newUsers, eventsToday, eventsInRange]
          properties:
            dau:
              type: integer
              minimum: 0
            wau:
              type: integer
              minimum: 0
            mau:
              type: integer
              minimum: 0
            activeUsers:
              type: integer
              minimum: 0
            newUsers:
              type: integer
              minimum: 0
            eventsToday:
              type: integer
              minimum: 0
            eventsInRange:
              type: integer
              minimum: 0
        funnel:
          type: object
          required: [registered, plantCreated, wateringMarked, pushSubscribed, rates]
          properties:
            registered:
              type: integer
              minimum: 0
              description: 'users.created_at в периоде, role ≠ ADMIN'
            plantCreated:
              type: integer
              minimum: 0
              description: 'distinct plants.user_id за plants.created_at в периоде'
            wateringMarked:
              type: integer
              minimum: 0
              description: 'distinct watering_logs.user_id (action=watered) в периоде'
            pushSubscribed:
              type: integer
              minimum: 0
              description: 'distinct push_subscriptions.user_id за created_at в периоде'
            rates:
              type: object
              required: [plantCreated, wateringMarked, pushSubscribed]
              properties:
                plantCreated:
                  type: number
                  description: 'процент от registered, 1 знак'
                wateringMarked:
                  type: number
                pushSubscribed:
                  type: number
        retention:
          type: array
          description: 'До 8 последних недельных когорт, от новых к старым; когорты с size=0 отброшены'
          items:
            type: object
            required: [cohort, cohortLabel, size, d1, d7, d30, d1Rate, d7Rate, d30Rate]
            properties:
              cohort:
                type: string
                format: date
                description: 'Начало недели когорты (понедельник, МСК)'
              cohortLabel:
                type: string
                pattern: '^[0-9]{2}\.[0-9]{2}$'
                description: 'DD.MM начала недели'
              size:
                type: integer
                minimum: 0
              d1:
                type: integer
                minimum: 0
              d7:
                type: integer
                minimum: 0
              d30:
                type: integer
                minimum: 0
              d1Rate:
                type: number
              d7Rate:
                type: number
              d30Rate:
                type: number
        events:
          type: array
          description: 'Топ-10 событий за период; пустой массив, если product_events нет'
          items:
            type: object
            required: [event, count, users]
            properties:
              event:
                type: string
              count:
                type: integer
                minimum: 0
              users:
                type: integer
                minimum: 0
                description: 'distinct user_id'
        push:
          type: object
          required: [notifications, clicks, ctr, clickedToday]
          properties:
            notifications:
              type: integer
              minimum: 0
            clicks:
              type: integer
              minimum: 0
              description: 'SUM(click_count) по уведомлениям за период'
            ctr:
              type: number
              description: 'clicks / notifications * 100, 1 знак'
            clickedToday:
              type: integer
              minimum: 0
              description: 'count(clicked_at за сегодня, МСК)'
        metrics:
          $ref: '#/components/schemas/ProductMetrics'

    ProductMetrics:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          minItems: 12
          maxItems: 12
          description: '12 метрик в фиксированном порядке: ttfv, activation, plants2, d1, d7, d30, push_ctr, returns_no_push, ai_usage, ai_cost, premium, share_organic'
          items:
            $ref: '#/components/schemas/ProductMetricItem'
        summary:
          $ref: '#/components/schemas/ProductMetricsSummary'

    ProductMetricsSummary:
      type: object
      required: [total, measured, partial, unavailable]
      properties:
        total:
          type: integer
          const: 12
        measured:
          type: integer
          minimum: 0
          description: 'Метрики со статусом measured'
        partial:
          type: integer
          minimum: 0
          description: 'Метрики со статусом partial'
        unavailable:
          type: integer
          minimum: 0
          description: 'Метрики со статусом unavailable'

    ProductMetricItem:
      type: object
      required: [id, label, priority, horizon, target, status, value, unit, display, detail, source, targetMet]
      properties:
        id:
          type: string
          enum: [ttfv, activation, plants2, d1, d7, d30, push_ctr, returns_no_push, ai_usage, ai_cost, premium, share_organic]
          description: 'Идентификатор метрики из листа «Метрики»'
        label:
          type: string
          description: 'Название строго из листа «Метрики»'
        priority:
          type: string
          enum: [P0, P1, P2]
        horizon:
          type: string
          description: 'Горизонт достижения цели'
        target:
          type: string
          description: 'Целевое значение в человекочитаемом виде'
        status:
          type: string
          enum: [measured, partial, unavailable]
          description: 'measured — считается по данным; partial — считается частично (нет тарифа/телеметрии/биллинга/миграции шаринга или данных); unavailable — нет источника'
        value:
          type: [number, 'null']
          description: 'Значение в единицах unit; null, если метрика недоступна или нет данных'
        unit:
          type: string
          enum: [seconds, percent, rub]
        display:
          type: string
          description: 'Готовое к показу значение: «142 с», «38,9%», «2,1 ₽»; «—» при отсутствии данных'
        detail:
          type: string
          description: 'Короткая методика/ограничение, например «медиана; n=42; 41% ≤ 60 с»'
        source:
          type: string
          description: 'Источник данных из листа «Метрики»'
        targetMet:
          type: [boolean, 'null']
          description: 'Достигнута ли цель; null, если значение неизвестно'

    GardenShare:
      type: object
      required: [token, path, createdAt, viewCount, signupCount]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{16,64}$'
          description: 'Случайный токен ссылки (16 random bytes в base64url)'
        path:
          type: string
          description: 'Путь публичной страницы на фронтенде: `/garden/<token>`'
        createdAt:
          type: [string, 'null']
          format: date-time
          description: 'Когда ссылка создана'
        viewCount:
          type: integer
          minimum: 0
          description: 'Просмотры публичной страницы сада'
        signupCount:
          type: integer
          minimum: 0
          description: 'Регистрации, атрибутированные этой ссылке'

    GardenShareStatus:
      type: object
      required: [share]
      properties:
        share:
          oneOf:
            - $ref: '#/components/schemas/GardenShare'
            - type: 'null'
          description: 'Активная (не отозванная) ссылка; null, если ссылки нет'

    GardenShareRevoked:
      type: object
      required: [share, revoked]
      properties:
        share:
          type: 'null'
          description: 'После отзыва активной ссылки нет'
        revoked:
          type: boolean
          const: true

    PublicGardenPlant:
      type: object
      required: [id, name, species, intervalDays]
      properties:
        id:
          type: integer
        name:
          type: string
        species:
          type: [string, 'null']
        intervalDays:
          type: [integer, 'null']
          description: 'Интервал полива в днях (`watering_interval_days`)'

    PublicGarden:
      type: object
      required: [garden]
      properties:
        garden:
          type: object
          required: [token, ownerName, plantCount, plants, sharedAt, viewCount]
          properties:
            token:
              type: string
              pattern: '^[A-Za-z0-9_-]{16,64}$'
            ownerName:
              type: string
              description: 'Первый токен users.name, иначе username, иначе «Садовод»'
            plantCount:
              type: integer
              minimum: 0
              description: 'Всего активных растений; в plants — не больше 100'
            plants:
              type: array
              maxItems: 100
              description: 'Активные растения (is_active), порядок created_at ASC'
              items:
                $ref: '#/components/schemas/PublicGardenPlant'
            sharedAt:
              type: [string, 'null']
              format: date-time
              description: 'Когда ссылка создана'
            viewCount:
              type: integer
              minimum: 0
              description: 'Просмотры после инкремента текущего вызова'

    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
        deployTarget:
          type: [string, 'null']
          enum: [compose, kubernetes, null]
        redis:
          type: string
          enum: [ok, unavailable, disabled]
        mail:
          type: string
          description: 'например `ok`, `not-configured`'
        push:
          type: object
          additionalProperties: true
          description: статус конфигурации VAPID (`configured`, `valid`, `error`)
        backgroundJobs:
          type: boolean
        aiCache:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        phone:
          type: [string, 'null']
          maxLength: 20
        bio:
          type: [string, 'null']
          maxLength: 300
        role:
          type: string
          enum: [USER, ADMIN]
        privilege_level:
          type: string
          enum: [free, premium, pro]
        timezone:
          type: [string, 'null']
          description: IANA-пояс (по умолчанию Europe/Moscow)
        marketing_email_opt_in:
          type: boolean
          description: согласие на маркетинговые письма (по умолчанию false)
        created_at:
          type: string
          format: date-time
          description: есть в админ-выборках; в `/api/users/me` не возвращается

    RegistrationRequest:
      type: object
      required: [email, password, privacyPolicyAccepted, termsAccepted]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: требования проверяются `isValidRegistrationPassword` (не короче 8 символов)
        name:
          type: string
          maxLength: 100
        username:
          type: string
          maxLength: 30
          description: '3–30 символов: латиница, цифры, `.`, `_`'
        privacyPolicyAccepted:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
        rememberMe:
          type: boolean
        timezone:
          type: string
        marketingConsent:
          type: boolean
          description: отдельное (необязательное) согласие на маркетинговые письма
        shareToken:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{16,64}$'
          description: |
            Необязательный токен публичной ссылки на сад (F13, из `/garden/<token>`):
            регистрация атрибутируется к шарингу (`garden_share_signups`). Неверный
            формат — `400`; неизвестный или отозванный токен молча игнорируется и не
            мешает регистрации.

    RegistrationResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 1024
        rememberMe:
          type: boolean

    LoginResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          maxLength: 300
        timezone:
          type: [string, 'null']

    CheckUsernameResponse:
      type: object
      properties:
        available:
          type: boolean
        username:
          type: string
        message:
          type: string

    DeleteAccountResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true
        removed:
          type: object
          additionalProperties: true
          description: 'счётчики удалённых записей: plants, photos, waterings, chatMessages, pushSubscriptions, notifications, legalConsents, cookieConsents, sessions, passkeys, photoFiles'

    AccountExport:
      type: object
      required: [format, formatVersion, exportedAt, account]
      properties:
        format:
          type: string
          const: webplant-account-export
        formatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        account:
          type: object
          additionalProperties: true
          description: 'санитизированный профиль: id, email, name, username, phone, bio, role, privilegeLevel, timezone'
        plants:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'растение с `carePlan` и массивом `photos`'
        wateringLogs:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, plantId, action, wateredAt, scheduledFor, hoursLate, daysLate, comment, metadata]
            description: 'отметки полива: `wateredAt` = `watering_logs.action_at`, `hoursLate` = `hours_late`, `daysLate` = floor(hoursLate / 24), `comment` = `note`'
            properties:
              id:
                type: integer
              plantId:
                type: [integer, 'null']
              action:
                type: [string, 'null']
              wateredAt:
                type: [string, 'null']
                format: date-time
              scheduledFor:
                type: [string, 'null']
                format: date-time
              hoursLate:
                type: [integer, 'null']
              daysLate:
