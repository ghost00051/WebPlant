                      type: integer
                    watering_time_of_day:
                      type: [string, 'null']
                    is_missed:
                      type: boolean
                    scheduled_for:
                      type: string
                      format: date-time
                    missed_since:
                      type: [string, 'null']
                      format: date-time
                    missed_slots:
                      type: integer
                      minimum: 0
                    can_backfill:
                      type: boolean
