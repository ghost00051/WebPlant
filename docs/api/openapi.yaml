  /api/admin/push/broadcasts:
    post:
      tags: [admin]
      operationId: adminCreatePushBroadcast
      summary: Создание push-рассылки
      description: |
        Поддерживает заголовок `Idempotency-Key` (8–200 символов `[A-Za-z0-9._:-]`, TTL
        24 часа): повтор возвращает существующую рассылку (`200`). Одинаковая рассылка
        отклоняется (`409`). Лимиты: 20 в час, 60 в сутки.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]{8,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBroadcastRequest'
      responses:
        '200':
          description: рассылка уже создана с этим ключом (идемпотентный повтор)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '201':
          description: рассылка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: такая рассылка уже создавалась
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: push не настроен на сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/push/broadcasts/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [admin]
      operationId: adminCancelPushBroadcast
      summary: Отмена push-рассылки
      responses:
        '200':
          description: отменена
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: эту рассылку нельзя отменить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/push/broadcasts/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [admin]
      operationId: adminRetryPushBroadcast
      summary: Повтор push-рассылки
      responses:
        '200':
          description: повтор поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: рассылку нельзя повторить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: повтор пока не реализован сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/admin/mail/overview:
    get:
      tags: [admin]
      operationId: adminMailOverview
      summary: Обзор почтовых рассылок
      responses:
        '200':
          description: 'объект `{mailConfigured, mailStatus, mailProblems, from, users, broadcasts, totals, recent}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/mail/recipients:
    get:
      tags: [admin]
      operationId: adminMailRecipients
      summary: Получатели писем
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 'объект `{items, total}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/mail/preview:
    post:
      tags: [admin]
      operationId: adminMailPreview
      summary: Предпросмотр письма
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailMessageRequest'
      responses:
        '200':
          description: отрендеренное письмо и имя для примера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/mail/test:
    post:
      tags: [admin]
      operationId: adminMailTest
      summary: Тестовое письмо на email администратора
      description: Лимит — 5 писем за 10 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailMessageRequest'
      responses:
        '200':
          description: письмо отправлено
          content:
            application/json:
              schema:
                type: object
                required: [sent, to]
                properties:
                  sent:
                    type: boolean
                    const: true
                  to:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: почта не настроена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '502':
          description: SMTP не принял письмо
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/admin/mail/broadcasts:
    post:
      tags: [admin]
      operationId: adminCreateMailBroadcast
      summary: Создание почтовой рассылки
      description: |
        Поддерживает `Idempotency-Key` (TTL 24 часа), защиту от дублей, отложенную отправку
        (`scheduledFor`). Отправка выполняется очередью раз в минуту. Лимит — 30 рассылок
        за 10 минут.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]{8,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailBroadcastRequest'
      responses:
        '201':
          description: рассылка создана (в очереди)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '200':
          description: идемпотентный повтор — возвращена существующая рассылка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: такая рассылка уже создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminObject'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: почта не настроена (для немедленной отправки)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/mail/broadcasts/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [admin]
      operationId: adminCancelMailBroadcast
      summary: Отмена почтовой рассылки
      responses:
        '200':
          description: отменена
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: рассылку нельзя отменить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT сессии или access-токен (httpOnly, Secure, SameSite=None)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "JWT обновления (30 дней), только при `rememberMe: true`"
    guestCookie:
      type: apiKey
      in: cookie
      name: guest_token
      description: Подписанный HMAC гостевой идентификатор

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25

  responses:
    BadRequest:
      description: некорректный запрос (валидация)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: доступ запрещён (нет роли ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ForbiddenOrigin:
      description: запрос с недопустимого origin или без Origin при cookie-сессии
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    PayloadTooLarge:
      description: тело запроса или файл больше допустимого размера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    UnsupportedMediaType:
      description: недопустимый Content-Type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    TooManyRequests:
      description: превышен лимит запросов (rate-limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServiceUnavailable:
      description: зависимость недоступна (ИИ, SMTP, push) или исчерпан бюджет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServerError:
      description: внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
        deployTarget:
          type: [string, 'null']
          enum: [compose, kubernetes, null]
        redis:
          type: string
          enum: [ok, unavailable, disabled]
        mail:
          type: string
          description: 'например `ok`, `not-configured`'
        push:
          type: object
          additionalProperties: true
          description: статус конфигурации VAPID (`configured`, `valid`, `error`)
        backgroundJobs:
          type: boolean
        aiCache:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        phone:
          type: [string, 'null']
          maxLength: 20
        bio:
          type: [string, 'null']
          maxLength: 300
        role:
          type: string
          enum: [USER, ADMIN]
        privilege_level:
          type: string
          enum: [free, premium, pro]
        timezone:
          type: [string, 'null']
          description: IANA-пояс (по умолчанию Europe/Moscow)
        marketing_email_opt_in:
          type: boolean
          description: согласие на маркетинговые письма (по умолчанию false)
        created_at:
          type: string
          format: date-time
          description: есть в админ-выборках; в `/api/users/me` не возвращается

    RegistrationRequest:
      type: object
      required: [email, password, privacyPolicyAccepted, termsAccepted]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: требования проверяются `isValidRegistrationPassword` (не короче 8 символов)
        name:
          type: string
          maxLength: 100
        username:
          type: string
          maxLength: 30
          description: '3–30 символов: латиница, цифры, `.`, `_`'
        privacyPolicyAccepted:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
        rememberMe:
          type: boolean
        timezone:
          type: string
        marketingConsent:
          type: boolean
          description: отдельное (необязательное) согласие на маркетинговые письма

    RegistrationResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 1024
        rememberMe:
          type: boolean

    LoginResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          maxLength: 300
        timezone:
          type: [string, 'null']

    CheckUsernameResponse:
      type: object
      properties:
        available:
          type: boolean
        username:
          type: string
        message:
          type: string

    DeleteAccountResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true
        removed:
          type: object
          additionalProperties: true
          description: 'счётчики удалённых записей: plants, photos, waterings, chatMessages, pushSubscriptions, notifications, legalConsents, cookieConsents, sessions, passkeys, photoFiles'

    AccountExport:
      type: object
      required: [format, formatVersion, exportedAt, account]
      properties:
        format:
          type: string
          const: webplant-account-export
        formatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        account:
          type: object
          additionalProperties: true
          description: 'санитизированный профиль: id, email, name, username, phone, bio, role, privilegeLevel, timezone'
        plants:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'растение с `carePlan` и массивом `photos`'
        wateringLogs:
          type: array
          items:
            type: object
            additionalProperties: true
        chatMessages:
          type: array
          items:
            type: object
            additionalProperties: true
        aiAdvice:
          type: array
          items:
            type: object
            additionalProperties: true
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        notificationPreferences:
          type: [object, 'null']
          additionalProperties: true
        pushSubscriptions:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'хост сервиса push, даты создания/успеха/инвалидации (без ключей и endpoint)'
        consents:
          type: object
          properties:
            cookie:
              type: array
              items:
                type: object
                additionalProperties: true
            legal:
              type: array
              items:
                type: object
                additionalProperties: true
        passkeys:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'deviceName, createdAt, lastUsedAt, transports (без credential/public key)'
        sessions:
          type: object
          properties:
            authSessions:
              type: integer
        siteVisits:
          type: array
          items:
            type: object
            additionalProperties: true

    NotificationPreferences:
      type: object
      required: [morning_summary_enabled, care_advice_enabled, dark_theme_enabled, theme_mode]
      properties:
        morning_summary_enabled:
          type: boolean
        care_advice_enabled:
          type: boolean
        dark_theme_enabled:
          type: boolean
        theme_mode:
          type: string
          enum: [system, light, dark]

    PasskeyCreationOptions:
      type: object
      required: [_key]
      additionalProperties: true
      description: Параметры `generateRegistrationOptions` + служебный `_key` для завершения
      properties:
        _key:
          type: string
          maxLength: 120
        challenge:
          type: string

    PasskeyRequestOptions:
      type: object
      required: [_key]
      additionalProperties: true
      description: Параметры `generateAuthenticationOptions` + служебный `_key`
      properties:
        _key:
          type: string
          maxLength: 120

    PasskeySummary:
      type: object
      properties:
        id:
          type: integer
        device_name:
          type: [string, 'null']
        transports:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time

    Plant:
      type: object
      required: [id, user_id, name]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
          maxLength: 255
        species:
          type: [string, 'null']
          maxLength: 255
        location:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 10000
        watering_interval_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
        watering_time_of_day:
          type: [string, 'null']
          enum: [morning, day, evening]
        last_watered_at:
          type: [string, 'null']
          format: date-time
        next_watering_at:
          type: [string, 'null']
          format: date-time
        is_active:
          type: boolean
        notify_morning:
          type: boolean
        notify_day_before:
          type: boolean
        reminder_weekdays:
          type: array
          items:
            type: integer
        metadata:
          type: object
          additionalProperties: true
          description: 'в т.ч. `prediction` (адаптивная модель) и `notifications` (прогресс напоминаний)'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PlantPhoto'

    PlantPhoto:
      type: object
      required: [id, plant_id, url]
      properties:
        id:
          type: integer
        plant_id:
          type: integer
        url:
          type: string
          maxLength: 2048
        sort_order:
          type: integer
          minimum: 0
        is_main:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PhotoInput:
      oneOf:
        - type: string
          maxLength: 2048
          description: '/uploads/plants/<32hex>.<ext>'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              maxLength: 2048
            sort_order:
              type: integer
              minimum: 0
            is_main:
              type: boolean
            metadata:
              type: object
              additionalProperties: true

    PlantCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        species:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        watering_interval_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
        watering_time_of_day:
          type: string
          enum: [morning, day, evening]
          default: morning
        notify_morning:
          type: boolean
          default: true
        notify_day_before:
          type: boolean
          default: false
        reminder_weekdays:
          type: array
          items:
            type: integer
        photos:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/PhotoInput'
        metadata:
          type: object
          additionalProperties: true

    PlantUpdateRequest:
      type: object
      description: 'те же поля, что при создании; передаются только изменяемые'
      properties:
        name:
          type: string
          maxLength: 255
        species:
          type: [string, 'null']
          maxLength: 255
        location:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 10000
        watering_interval_days:
          type: integer
          minimum: 1
          maximum: 365
        watering_time_of_day:
          type: string
          enum: [morning, day, evening]
        notify_morning:
          type: boolean
        notify_day_before:
          type: boolean
        reminder_weekdays:
          type: array
          items:
            type: integer
        metadata:
          type: object
          additionalProperties: true

    WateringLog:
      type: object
      required: [id, plant_id, user_id, action, action_at]
      properties:
        id:
          type: integer
        plant_id:
          type: integer
        user_id:
          type: integer
        action:
          type: string
          enum: [watered, skipped]
        action_at:
          type: string
          format: date-time
        scheduled_for:
          type: [string, 'null']
          format: date-time
        hours_late:
          type: [integer, 'null']
        note:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    WaterResponse:
      allOf:
        - $ref: '#/components/schemas/Plant'
        - type: object
          properties:
            duplicate:
              type: boolean
              description: полив уже отмечен в пределах короткого окна
            backfilled:
              type: boolean
              description: полив записан за прошлую дату
            scheduled_for:
              type: [string, 'null']
              format: date-time
            converted_skip:
              type: boolean
              description: пропуск превращён в полив

