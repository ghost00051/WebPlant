          minimum: 0
          description: Сколько активных растений этого вида добавлено.
        usersCount:
          type: integer
          minimum: 0
          description: Сколько уникальных пользователей добавили этот вид.
        avgIntervalDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Средний интервал полива по этому виду в днях.

    PlantCreateRequest:
      type: object
      required: [name]
