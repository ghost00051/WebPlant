                  `scheduled_for`, `skipped_at`, `hours_late`, `days_late`, `note`;
                  для `watered` — `id`, `watered_at`, `scheduled_for`, `hours_late`, `note`;
                  для `care` — `action_code`, `title`, `product_name`, `dose`, `method`,
                  `log_id`, `performed_at`.
                items:
                  type: object
                  required: [kind, plant]
                  additionalProperties: true
                  properties:
                    kind:
                      type: string
                      enum: [overdue, skipped, watered, care]
                    plant:
                      type: object
                      additionalProperties: true

