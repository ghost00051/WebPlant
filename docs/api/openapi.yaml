                type: string
                format: date
                description: локальная дата полива
              plants:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: [string, 'null']
                    species:
                      type: [string, 'null']
                    location:
                      type: [string, 'null']
                    watered_at:
                      type: string
                      format: date-time
                    scheduled_for:
                      type: [string, 'null']
                      format: date-time
                    hours_late:
                      type: [integer, 'null']
                    note:
                      type: [string, 'null']

