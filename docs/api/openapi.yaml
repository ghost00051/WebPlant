            Объект с `topSpecies`, `topUsersByPlants`, `topUsersByWaterings`,
            `topUsersByChat`, `wateringsByWeekday`, `wateringsByHour`,
            `plantsByInterval`, `consentTypes`, `registrationsByWeekday`,
            `recentUsers`, `averages`, `visitsTracked`, `userCreatedAtTracked`,
            `utmTracked` и `utmSources`.

            `utmSources` (F03) — топ-10 `site_visit_days` за период по `visitors`
            (число строк-визитов) для непустых `utm_source`:
            `[{source, medium, campaign, visitors}]`. Если колонок UTM нет или
