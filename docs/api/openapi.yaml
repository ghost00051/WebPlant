                      type: [string, 'null']
                      format: date-time
                    days_late:
                      type: integer
                      minimum: 0
                    reason:
                      type: [string, 'null']
                      enum: [missed_slot, auto_skipped, reminders_paused, null]
                    missed_policy:
                      type: string
                      enum: [preserve, auto_skip]

    HistoryAllResponse:
      type: object
      required: [generatedAt, total, limit, offset, items]
      properties:
