      required: [subject, body]
      properties:
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000
        ctaLabel:
          type: [string, 'null']
          maxLength: 80
        ctaUrl:
          type: [string, 'null']
          maxLength: 2048

    MailBroadcastRequest:
      allOf:
        - $ref: '#/components/schemas/MailMessageRequest'
        - type: object
          properties:
            targetMode:
              type: string
              enum: [all, users]
              default: all
            userIds:
              type: array
              maxItems: 1000
              items:
                type: integer
            scheduledFor:
              type: [string, 'null']
              format: date-time

    PagedUsers:
      type: object
      required: [items, total, page, limit, pages]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'пользователь с счётчиками: id, email, name, username, phone, role, privilegeLevel, createdAt, plants, activePlants, waterings, photos, chatMessages, pushSubscriptions, lastActivityAt'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    AdminObject:
      type: object
      additionalProperties: true
      description: |
        Ответ админ-API. Точный набор полей зависит от раздела и версии панели; контракт
        фиксирует только факт JSON-объекта и коды ответов. Для полей, которые нужно
        использовать программно, опирайтесь на `Backend/controllers/admin*.js`
        (админка — единственный потребитель этих эндпоинтов).
