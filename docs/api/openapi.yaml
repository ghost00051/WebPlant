  /api/admin/product/analytics:
    get:
      tags: [admin]
      operationId: adminProductAnalytics
      summary: Продуктовая аналитика F01–F03
      description: |
        Агрегаты событийной аналитики за `days` дней (МСК, текущий день включён).

        * `activity` — DAU/WAU/MAU (distinct `user_id` в `product_events` за 1/7/30
          дней), `activeUsers` за период, `newUsers` (`users.created_at` в периоде),
          `eventsToday`/`eventsInRange` — количество событий;
        * `funnel` — по таблицам: `users.created_at`, `plants.created_at`,
          `watering_logs` (`action='watered'`), `push_subscriptions.created_at`;
          `rates` — проценты от `registered` с одним знаком;
        * `retention` — до 8 последних недельных когорт (неделя с понедельника,
          МСК) по `users.created_at` (role ≠ ADMIN): `d1`/`d7`/`d30` — число
          пользователей когорты с событием `product_events` ИЛИ визитом
          `site_visit_days` в окне `reg_day+1..reg_day+N`, `*Rate` — проценты с одним
          знаком; строки отсортированы от новых к старым, когорты с `size = 0` не
          выводятся, ещё не наступившие окна дают 0;
        * `events` — топ-10 событий за период (`count`, distinct `users`);
        * `push` — уведомления за период, `clicks = SUM(click_count)`,
          `ctr = clicks/notifications*100` (1 знак), `clickedToday` — клики за сегодня (МСК);
        * `metrics` — 12 продуктовых метрик листа «Метрики» (TTFV, Activation rate,
          доля аккаунтов с ≥2 растениями, D1/D7/D30 retention, Push CTR, возвраты без
          push, использование ИИ, стоимость ИИ на активного, конверсия в Premium,
          органика из шаринга): `items` в фиксированном порядке и `summary` со
          счётчиками статусов. У каждой метрики `status`: `measured` — посчитана по
          данным, `partial` — считается частично (нет тарифа/телеметрии/биллинга/
          миграции или неподходящих данных), `unavailable` — нет источника. `value` —
          число в `unit` (`seconds`/`percent`/`rub`), `display` — готовое к показу
          значение с запятой и суффиксом (`142 с`, `38,9%`, `2,1 ₽`, `—`), `targetMet` —
          достигнута ли цель (`null`, если значения нет). `premium` всегда `partial`
          (биллинг F15 не внедрён). `share_organic` — `measured`, если есть таблицы
          `garden_shares`/`garden_share_signups` и за период были регистрации:
          `value` — доля регистраций (role ≠ ADMIN) с записью в
          `garden_share_signups`; `detail` содержит «регистрации из шаринга X из Y;
          просмотров сада Z; кликов «Поделиться» N» (клики — события
          `product_events.event = 'share_clicked'` за период, только если
          `product_events` есть). Без таблиц шаринга (миграция F13 не применена) или
          без регистраций за период метрика остаётся `partial`. `ai_cost` —
          `partial`, если тариф `AI_PRICE_*` не задан или за период нет телеметрии ИИ.
          `ai_cost` — средний расход ИИ за день на DAU (₽/DAU в день: суммарный расход
          периода ÷ активные user-дни), `ai_usage` — средняя по дням доля DAU,
          использовавших чат/диагностику.

        Если таблицы `product_events` нет, ответ `200` с `eventsTracked: false`:
        `activity` и `events` нулевые или пустые, `retention` считается по
        `site_visit_days` (если они есть) и пуст, если нет ни одного источника; `funnel`
        и `push` работают. Отсутствующие таблицы/колонки для `metrics` не дают `500`:
        соответствующие метрики получают `status: unavailable` или `partial` и
        `display: —`, остальные считаются по доступным данным.
        Если нет колонок `clicked_at`/`click_count` — `push.clicks = 0`, `ctr = 0`.
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: продуктовая аналитика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

