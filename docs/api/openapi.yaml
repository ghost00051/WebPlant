openapi: 3.1.0
info:
  title: WebPlant («Лейка») API
  version: 1.2.6
  summary: REST API учёта комнатных растений и ИИ-помощника «Лейка»
  description: |
    Контракт HTTP API backend-сервиса WebPlant (Backend 1.2.6). Источник истины —
    код: `Backend/index.js`, `Backend/routes/*.js`, `Backend/controllers/*.js`,
    `Backend/models/*.js`. Спека фиксирует фактические методы, пути, коды ответов и
    структуры, которые сервис возвращает сейчас.


    * боевой: `https://server.checktheplants.ru/api` (плюс `/health` и `/livez` вне `/api`);
    * локально: `http://localhost:5000/api` (порт из `PORT`).

    Фронтенд обращается к API с другого origin (`https://checktheplants.ru`,
    `https://admin.checktheplants.ru`), поэтому CORS включён с `credentials: true`.


    Сессия хранится в httpOnly-cookie, токенов в `localStorage` нет:

    * `token` — JWT (`tokenType=session`, 24 ч) либо access-токен (`tokenType=access`, 15 мин)
      при включённом «запомнить меня»;
    * `refresh_token` — JWT `tokenType=refresh` (30 дней), только при `rememberMe: true`;
      access-токен продлевается автоматически;
    * `guest_token` — подписанный HMAC гостевой идентификатор (согласия и чат без входа).

    Cookie выдаются на домен `.checktheplants.ru` с `SameSite=None; Secure`, поэтому
    браузерные клиенты должны отправлять запросы с `credentials: 'include'`.
    Отзыв сессий — `auth_sessions.revoked_at`; при отзыве все запросы получают `401`.


    Отдельного CSRF-токена нет. Для `POST`/`PUT`/`PATCH`/`DELETE` сервер проверяет
    `Origin` и `Sec-Fetch-Site`: запрос с недопустимого origin, кросс-сайтовый запрос без
    `Origin`, а также любой изменяющий запрос с auth-cookie и без заголовка `Origin`
    отклоняется с `403` (`{"message":"Запрос с этого источника запрещён"}`).
    Разрешённые origin'ы: `FRONTEND_URL`, `ADMIN_PANEL_ORIGIN`, а вне production —
    `LOCAL_DEV_ORIGINS`.


    * тело JSON/urlencoded — не больше 100 kb (`413` при превышении);
    * для запросов с телом обязателен `Content-Type`: `application/json`,
      `application/x-www-form-urlencoded`, `multipart/form-data` или `*+json`, иначе `415`;
    * файлы: до 5 МБ на файл, до 2 файлов в `POST /api/upload`, до 5 файлов в
      `POST /api/chat/photo`;
    * на большинство групп эндпоинтов действует rate-limit (`429`); лимиты перечислены в
      `ARCHITECTURE.md` §7 и в описании операций.


    Все ошибки — объект `{"message": "<текст>"}`. Обобщённые ответы обработчика:
    `400 {"message":"Некорректный запрос"}`, `413 {"message":"Размер запроса превышает
    допустимый лимит"}`, `500 {"message":"Internal server error"}`; доменные ошибки
    возвращают собственный текст (см. схемы).


    * `503` — недоступная зависимость (БД при `/health`, SMTP при сбросе пароля,
      ИИ-сервис, push не настроен) или исчерпан суточный бюджет ИИ для гостя;
    * `501` — эндпоинт объявлен, но ещё не реализован сервером
      (`POST /api/admin/push/broadcasts/{id}/retry` возвращает `501`, если метод
      отсутствует в контроллере).
servers:
  - url: https://server.checktheplants.ru
    description: боевой сервер (API — под /api, проверки — /health и /livez)
  - url: http://localhost:5000
    description: локальный запуск backend

tags:
  - name: system
    description: проверки живости и служебные вызовы
  - name: auth
    description: регистрация, вход, выход, профиль, сброс пароля
  - name: passkey
    description: WebAuthn-ключи (passkeys)
  - name: plants
    description: растения, расписание, поливы, фото, советы ИИ
  - name: garden
    description: шаринг сада F13 — публичная ссылка на сад и атрибуция регистраций
  - name: chat
    description: чат с ИИ-помощником и анализ фото
  - name: notifications
    description: in-app уведомления
  - name: push
    description: подписка на push-уведомления
  - name: upload
    description: загрузка фотографий растений
  - name: consents
    description: cookie- и юридические согласия
  - name: admin
    description: админ-API (только role=ADMIN)
  - name: events
    description: продуктовая аналитика F01 — приём пользовательских событий

security:
  - cookieAuth: []
  - refreshCookie: []

paths:
  /livez:
    get:
      tags: [system]
      operationId: getLivez
      summary: Проверка живости процесса
      description: Не обращается к БД и внешним сервисам. Используется liveness-пробой.
      security: []
      responses:
        '200':
          description: процесс жив
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  timestamp:
                    type: string
                    format: date-time

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Готовность сервиса и состояние подсистем
      description: |
        Проверяет подключение к PostgreSQL (`sequelize.authenticate()`). Используется
        readiness-пробой Kubernetes и healthcheck'ом compose.
      security: []
      responses:
        '200':
          description: сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: БД недоступна
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: unavailable

  /api/users/registration:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Регистрация
      description: |
        Создаёт пользователя, согласия (`privacy_policy`, `terms_of_service`, версия 2.0),
        настройки уведомлений; привязывает гостевые согласия и сообщения чата к аккаунту.
        Необязательный `shareToken` (F13) атрибутирует регистрацию к ссылке шаринга.
        Выдаёт cookie сессии. Лимит: 5 запросов в час с IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: аккаунт создан
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`token` (и `refresh_token` при `rememberMe: true`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: некорректные данные или не приняты обязательные документы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          description: email или username уже заняты (обобщённый текст)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Вход по email и паролю
      description: |
        Лимит: 10 запросов за 15 минут с IP. Ответ `401` одинаков для неизвестного email и
        неверного пароля (защита от перечисления пользователей).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/logout:
    post:
      tags: [auth]
      operationId: logoutUser
      summary: Выход
      description: Отзывает текущие токены в `auth_sessions` и очищает cookie.
      security: []
      responses:
        '200':
          description: выход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Текущий пользователь
      responses:
        '200':
          description: профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [auth]
      operationId: updateProfile
      summary: Обновление профиля
      description: |
        Принимает `name`, `username`, `email`, `phone`, `bio`, `timezone`. При смене
        часового пояса пересчитывает `next_watering_at` активных растений. Требует cookie
        `token` (иначе `401`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          description: пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          description: username или email уже заняты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [auth]
      operationId: deleteMe
      summary: Удаление аккаунта со всеми данными
      description: |
        Требует `confirm: "УДАЛИТЬ"` и пароль. Удаляет растения, фото (включая файлы),
        поливы, чат, уведомления, настройки, push-подписки, согласия, сессии, passkeys,
        токены сброса; в `ai_advice_logs` и `site_visit_days` обнуляет `user_id`,
        в рассылках — `created_by`. Аккаунт администратора удаляется только из админ-панели.
        Лимит: 5 попыток в час на пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm, password]
              properties:
                confirm:
                  type: string
                  const: УДАЛИТЬ
                password:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: аккаунт удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '400':
          description: не передан `confirm` или пароль
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      requiresConfirmation:
                        type: boolean
                      requiresPassword:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: неверный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '409':
          description: попытка удалить аккаунт администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/me/export:
    get:
      tags: [auth]
      operationId: exportAccountData
      summary: Экспорт данных аккаунта (JSON-файл)
      description: |
        Возвращает JSON с заголовком `Content-Disposition: attachment`
        (`lejka-account-<id>-<YYYY-MM-DD>.json`) и `Cache-Control: no-store`.
        Лимит: 10 запросов в час на пользователя.
      responses:
        '200':
          description: данные аккаунта
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/unsubscribe:
    get:
      tags: [auth]
      operationId: unsubscribePageMarketing
      summary: Страница подтверждения отписки от рассылок (HTML)
      description: |
        Ссылка из письма (`RFC 8058`, заголовки `List-Unsubscribe`/`List-Unsubscribe-Post`).
        Токен — HMAC-SHA256 от `unsubscribe:<user_id>` на `SECRET_KEY`, в БД не хранится.
        Требует `uid` и `token` в query; работает без авторизации и без cookie.
        Лимит — 30 запросов за 15 минут с IP.
      security: []
      parameters:
        - name: uid
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML-страница подтверждения отписки
          content:
            text/html:
              schema:
                type: string
        '400':
          description: некорректная ссылка (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string
        '404':
          description: пользователь не найден (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string
        '429':
          description: превышен лимит запросов (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string
        '500':
          description: внутренняя ошибка (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      operationId: unsubscribeMarketing
      summary: Отписка от рассылок в один клик
      description: |
        One-click отписка почтовых клиентов: `uid`/`token` из query или из тела формы.
        Идемпотентно: повторная отписка возвращает тот же результат и не переписывает
        `marketing_email_opt_out_at`. После успеха `marketing_email_opt_in = false`.
      security: []
      parameters:
        - name: uid
          in: query
          required: false
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                uid:
                  type: string
                token:
                  type: string
                List-Unsubscribe:
                  type: string
                  description: значение `List-Unsubscribe=One-Click` от почтового клиента
      responses:
        '200':
          description: HTML-страница «Вы отписаны»
          content:
            text/html:
              schema:
                type: string
        '400':
          description: некорректная ссылка/токен (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string
        '429':
          description: превышен лимит запросов (HTML-страница ошибки)
          content:
            text/html:
              schema:
                type: string

  /api/users/me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Настройки уведомлений и темы
      responses:
        '200':
          description: настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [notifications]
      operationId: updateNotificationPreferences
      summary: Изменение настроек уведомлений и темы
      description: Лимит — 60 изменений в минуту на пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                morning_summary_enabled:
                  type: boolean
                care_advice_enabled:
                  type: boolean
                dark_theme_enabled:
                  type: boolean
                theme_mode:
                  type: string
                  enum: [system, light, dark]
      responses:
        '200':
          description: сохранённые настройки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/check-username:
    get:
      tags: [auth]
      operationId: checkUsername
      summary: Проверка доступности username
      description: Лимит — 30 запросов в минуту.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 30
      responses:
        '200':
          description: результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameResponse'
        '400':
          description: некорректный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Запрос ссылки сброса пароля
      description: |
        Всегда возвращает обобщённый ответ (не раскрывает существование аккаунта).
        Токен живёт 30 минут, в БД хранится его sha256-хэш; ссылка ведёт на
        `<FRONTEND_URL>/reset-password#token=…`. Лимит: 5 запросов в час с IP.
        Без настроенного SMTP — `503`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: письмо отправлено (если аккаунт существует)
          content:
            application/json:
              schema:
                type: object
                required: [message, expiresInMinutes]
                properties:
                  message:
                    type: string
                  expiresInMinutes:
                    type: integer
                    const: 30
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: почта не настроена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/password-reset/verify:
    get:
      tags: [auth]
      operationId: verifyPasswordResetToken
      summary: Проверка ссылки сброса пароля
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: токен действителен
          content:
            application/json:
              schema:
                type: object
                required: [valid, email, expiresInMinutes]
                properties:
                  valid:
                    type: boolean
                    const: true
                  email:
                    type: string
                    description: email с маскировкой
                  expiresInMinutes:
                    type: integer
        '400':
          description: токен отсутствует, истёк или использован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Установка нового пароля по токену
      description: Пароль — не короче 8 символов; после успеха cookie сессии очищаются.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: пароль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: неверный токен или слабый пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users:
    get:
      tags: [admin, auth]
      operationId: adminListUsersLegacy
      summary: Список пользователей (админ, простая выборка)
      description: Возвращает всех пользователей без пароля. Основной список — `GET /api/admin/users`.
      responses:
        '200':
          description: пользователи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/register/start:
    post:
      tags: [passkey]
      operationId: startPasskeyRegistration
      summary: Начало регистрации passkey
      description: Требует авторизации. Возвращает параметры WebAuthn и служебный `_key`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: параметры создания credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/register/finish:
    post:
      tags: [passkey]
      operationId: finishPasskeyRegistration
      summary: Завершение регистрации passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_key]
              properties:
                _key:
                  type: string
                  maxLength: 120
                deviceName:
                  type: string
                  maxLength: 120
              additionalProperties: true
      responses:
        '200':
          description: ключ зарегистрирован
          content:
            application/json:
              schema:
                type: object
                required: [ok, passkey]
                properties:
                  ok:
                    type: boolean
                    const: true
                  passkey:
                    type: object
                    properties:
                      id:
                        type: integer
                      device_name:
                        type: [string, 'null']
                      created_at:
                        type: string
                        format: date-time
                  deviceType:
                    type: [string, 'null']
                  backedUp:
                    type: [boolean, 'null']
        '400':
          description: челлендж истёк или подпись не проверена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: ключ уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/login/start:
    post:
      tags: [passkey]
      operationId: startPasskeyLogin
      summary: Начало входа по passkey
      description: Email опционален (если передан — ограничивает список ключей).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: параметры запроса credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/login/finish:
    post:
      tags: [passkey]
      operationId: finishPasskeyLogin
      summary: Завершение входа по passkey
      description: Выдаёт cookie сессии (аналог парольного входа).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_key]
              properties:
                _key:
                  type: string
                  maxLength: 120
                rememberMe:
                  type: boolean
              additionalProperties: true
      responses:
        '200':
          description: вход выполнен
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok:
                    type: boolean
                    const: true
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: челлендж истёк, подпись не проверена, ключ не соответствует аккаунту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: ключ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: ошибка входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/users/passkey:
    get:
      tags: [passkey]
      operationId: listPasskeys
      summary: Список passkey-устройств
      responses:
        '200':
          description: устройства
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasskeySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/exists:
    get:
      tags: [passkey]
      operationId: hasAnyPasskey
      summary: Есть ли у аккаунта passkey
      security: []
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: результат проверки (без email всегда `false`)
          content:
            application/json:
              schema:
                type: object
                required: [hasPasskey]
                properties:
                  hasPasskey:
                    type: boolean
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/passkey/{id}:
    patch:
      tags: [passkey]
      operationId: renamePasskey
      summary: Переименование passkey-устройства
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: новое имя
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  device_name:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [passkey]
      operationId: deletePasskey
      summary: Удаление passkey-устройства
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants:
    get:
      tags: [plants]
      operationId: listPlants
      summary: Активные растения пользователя
      description: Возвращает растения с фотографиями (`photos`), сортировка по `created_at` DESC.
      responses:
        '200':
          description: растения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [plants]
      operationId: createPlant
      summary: Создание растения
      description: |
        Фотографии должны быть предварительно загружены через `POST /api/upload`
        (принимаются только пути `/uploads/plants/<32hex>.<ext>`, для которых файл существует).
        Лимит записи: 120 операций за 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantCreateRequest'
      responses:
        '201':
          description: созданное растение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/need-watering:
    get:
      tags: [plants]
      operationId: listNeedWatering
      summary: Растения, которым нужен полив
      description: '`next_watering_at` раньше начала завтрашнего дня или установлен `metadata.missed_since`.'
      responses:
        '200':
          description: растения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/schedule:
    get:
      tags: [plants]
      operationId: getSchedule
      summary: Календарь полива по дням
      description: Группирует вхождения расписания по дням с учётом часового пояса пользователя.
      responses:
        '200':
          description: календарь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/history:
    get:
      tags: [plants]
      operationId: getWateringHistoryAll
      summary: История поливов по всем растениям (по дням)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: история
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryAllResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/timeline:
    get:
      tags: [plants]
      operationId: getTimeline
      summary: Лента событий ухода (поливы, пропуски, просрочки)
      responses:
        '200':
          description: события по дням
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/stats/completion:
    get:
      tags: [plants]
      operationId: getCompletionStats
      summary: Статистика своевременности полива
      responses:
        '200':
          description: статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/suggest-species:
    post:
      tags: [plants]
      operationId: suggestSpecies
      summary: Подсказка вида растения (ИИ)
      description: Лимит — 20 запросов в час на пользователя. `503` при ошибке ИИ-сервиса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: предложенный вид
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/watering-advice:
    post:
      tags: [plants]
      operationId: suggestWateringAdvice
      summary: Совет по интервалу полива (ИИ)
      description: |
        Возвращает либо уточняющий вопрос (`type: question`), либо рекомендацию
        (`type: recommendation`) с интервалом и причиной. При ошибке модели или
        исчерпанном бюджете отдаётся фолбэк (`source: fallback`). Лимит — 30 запросов в час.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WateringAdviceRequest'
      responses:
        '200':
          description: совет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WateringAdvice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/watering-time-advice:
    post:
      tags: [plants]
      operationId: suggestWateringTime
      summary: Совет по времени суток для полива (ИИ)
      description: Лимит — 30 запросов в час на пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WateringTimeRequest'
      responses:
        '200':
          description: совет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WateringTimeAdvice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/export:
    get:
      tags: [plants]
      operationId: exportPlantsCsv
      summary: CSV-выгрузка активных растений
      description: |
        Возвращает `text/csv` с BOM UTF-8, разделитель `;`, заголовок
        `id;name;species;location;watering_interval_days;watering_time_of_day;last_watered_at;next_watering_at;created_at`.
        Даты форматируются в часовом поясе пользователя. Не более 5000 растений.
        Ответ — `Content-Disposition: attachment; filename="webplant-plants.csv"`,
        `Cache-Control: no-store`.
      responses:
        '200':
          description: CSV-файл
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [plants]
      operationId: getPlant
      summary: Растение по идентификатору
      responses:
        '200':
          description: растение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: растение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [plants]
      operationId: updatePlant
      summary: Обновление растения
      description: |
        Ручная смена интервала сбрасывает обучение адаптивной модели
        (`plants.metadata.prediction`). Лимит записи: 120 операций за 15 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantUpdateRequest'
      responses:
        '200':
          description: обновлённое растение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [plants]
      operationId: deletePlant
      summary: Удаление растения
      description: Удаляет растение, его фото (и файлы), поливы.
      responses:
        '200':
          description: удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [plants]
      operationId: addPlantPhotos
      summary: Привязка загруженных фотографий к растению
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/PhotoInput'
      responses:
        '201':
          description: созданные записи фото
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/water:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [plants]
      operationId: waterPlant
      summary: Отметить полив
      description: |
        Без `scheduled_for` — полив сейчас: повтор в течение короткого окна даёт
        `duplicate: true`. С `scheduled_for` — «дозапись» за прошлую дату
        (`backfilled: true`), будущая дата запрещена (`400`), повтор за ту же дату — `409`.
        Пересчитывает адаптивный интервал и `next_watering_at`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                scheduled_for:
                  type: string
                  description: дата/время слота в прошлом (ISO 8601)
      responses:
        '200':
          description: растение после полива (возможны `duplicate`, `backfilled`, `converted_skip`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: полив за эту дату уже отмечен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/water/{logId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/LogId'
    delete:
      tags: [plants]
      operationId: deleteWatering
      summary: Отмена записи о поливе
      description: |
        Удаляет запись (или возвращает её в состояние «пропуск», если она была создана
        из пропуска) и восстанавливает расписание, если запись была последней.
      responses:
        '200':
          description: запись удалена
          content:
            application/json:
              schema:
                type: object
                required: [message, scheduleRestored, restored_skip]
                properties:
                  message:
                    type: string
                  scheduleRestored:
                    type: boolean
                  restored_skip:
                    type: boolean
                  next_watering_at:
                    type: [string, 'null']
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: растение или запись не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/skip:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [plants]
      operationId: skipWatering
      summary: Пропустить полив
      description: Переносит следующий полив на `days` дней вперёд (по умолчанию — на один интервал).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 2000
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        '200':
          description: растение после переноса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [plants]
      operationId: getPlantHistory
      summary: История поливов растения
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: записи журнала
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, items]
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WateringLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [plants]
      operationId: getPlantStats
      summary: Статистика поливов растения
      responses:
        '200':
          description: статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/plants/{id}/metadata:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [plants]
      operationId: updatePlantMetadata
      summary: Обновление metadata растения
      description: |
        Принимает произвольный JSON-объект; зарезервированные ключи (адаптивная модель,
        прогресс уведомлений, `missed_since`) игнорируются. Ограничение размера —
        `MAX_METADATA_BYTES` (валидация вернёт `400` при превышении).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: обновлённое растение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/chat:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: Сообщение ИИ-помощнику
      description: |
        Доступно гостю (по `guest_token`) и пользователю. Лимиты: 15 сообщений в минуту с IP,
        гость — 40 в сутки, пользователь — 300 в сутки. Часть запросов (полив, список
        растений) обрабатывается локально без модели (`local: true`). При сбое модели
        возвращается ответ по данным приложения (`degraded: true`); гость при исчерпанном
        суточном бюджете получает `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 1000
                sessionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: ответ помощника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: сессия принадлежит другому владельцу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/chat/photo:
    post:
      tags: [chat]
      operationId: analyzeChatPhoto
      summary: Анализ фото растения в чате
      description: |
        `multipart/form-data`, поле `photo` (до 5 файлов по 5 МБ; JPEG, PNG, WebP, HEIC).
        Лимит фото — 12 в час на пользователя/IP. Диагностика выполняется моделью Vision;
        при сбое возвращается деградированный ответ.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                message:
                  type: string
                  maxLength: 1000
                sessionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: результат анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPhotoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '413':
          description: файл больше 5 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/chat/history:
    get:
      tags: [chat]
      operationId: getChatHistory
      summary: История текущей или указанной сессии
      description: Лимит — 120 запросов в минуту с IP.
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: сообщения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [chat]
      operationId: clearChatSession
      summary: Удаление переписки сессии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: чат удалён
          content:
            application/json:
              schema:
                type: object
                required: [message, sessionId]
                properties:
                  message:
                    type: string
                  sessionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions:
    get:
      tags: [chat]
      operationId: listChatSessions
      summary: Список чатов пользователя/гостя
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: чаты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Список уведомлений
      description: Лимит чтения — 300 запросов в минуту.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: уведомления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getUnreadCount
      summary: Количество непрочитанных
      responses:
        '200':
          description: счётчик
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount]
                properties:
                  unreadCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/read-all:
    patch:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Отметить все уведомления прочитанными
      responses:
        '200':
          description: результат
          content:
            application/json:
              schema:
                type: object
                required: [updatedCount, unreadCount]
                properties:
                  updatedCount:
                    type: integer
                  unreadCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Отметить уведомление прочитанным
      responses:
        '200':
          description: уведомление и счётчик
          content:
            application/json:
              schema:
                type: object
                required: [item, changed, unreadCount]
                properties:
                  item:
                    $ref: '#/components/schemas/Notification'
                  changed:
                    type: boolean
                  unreadCount:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/{id}/click:
    post:
      tags: [notifications]
      operationId: markNotificationClicked
      summary: Клик по push-уведомлению (F03)
      description: |
        Идемпотентная отметка клика: `clicked_at` ставится только при первом клике
        (`COALESCE(clicked_at, now())`), `read_at` проставляется, если уведомление
        ещё не прочитано, `click_count` инкрементируется при каждом вызове.
        Доступно только владельцу уведомления; чужое или несуществующее — `404`.
        Лимит изменений уведомлений — 120 запросов в минуту на пользователя.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: клик отмечен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationClickResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/push/vapid-public-key:
    get:
      tags: [push]
      operationId: getVapidPublicKey
      summary: Публичный VAPID-ключ
      security: []
      responses:
        '200':
          description: ключ
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: string
        '503':
          description: push не настроен (нет/некорректны VAPID-ключи)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      detail:
                        type: [string, 'null']

  /api/push/subscribe:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Сохранение push-подписки
      description: |
        Гость сохраняет подписку без `user_id`, пользователь — со своим `user_id`.
        Подписка, привязанная к другому аккаунту, отклоняется с `409`.
        Лимиты: 10 запросов за 15 минут и 50 в сутки.
      security:
        - cookieAuth: []
        - refreshCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription:
                  $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '200':
          description: существующая подписка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscribeResponse'
        '201':
          description: подписка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscribeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: подписка привязана к другому аккаунту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/push/unsubscribe:
    post:
      tags: [push]
      operationId: unsubscribePush
      summary: Удаление push-подписки
      description: Лимит — 30 запросов за 15 минут.
      security:
        - cookieAuth: []
        - refreshCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  maxLength: 2048
      responses:
        '200':
          description: результат удаления
          content:
            application/json:
              schema:
                type: object
                required: [message, deleted]
                properties:
                  message:
                    type: string
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/upload:
    post:
      tags: [upload]
      operationId: uploadPlantPhotos
      summary: Загрузка фотографий растения
      description: |
        Принимает до 2 файлов по 5 МБ (JPEG, PNG, WebP, HEIC) в поле `photos`; проверяет
        сигнатуру файла и создаёт миниатюру. Лимит — 10 загрузок в час на пользователя.
        Полученные `urls` затем передаются в `POST /api/plants` или `/api/plants/{id}/photos`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: файлы приняты
          content:
            application/json:
              schema:
                type: object
                required: [urls, thumbs]
                properties:
                  urls:
                    type: array
                    items:
                      type: string
                  thumbs:
                    type: array
                    items:
                      type: [string, 'null']
        '400':
          description: файлы не переданы или формат не поддерживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cookie-consents:
    get:
      tags: [consents]
      operationId: listCookieConsents
      summary: Действующие cookie-согласия
      description: Гость определяется по `guest_token`, пользователь — по сессии.
      security:
        - cookieAuth: []
        - refreshCookie: []
        - guestCookie: []
      responses:
        '200':
          description: согласия
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CookieConsentSummary'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [consents]
      operationId: setCookieConsent
      summary: Сохранить одно согласие
      security:
        - cookieAuth: []
        - refreshCookie: []
        - guestCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consentType, isAccepted]
              properties:
                consentType:
                  type: string
                  enum: [technical, analytics, marketing, personalization]
                isAccepted:
                  type: boolean
                version:
                  type: string
                  maxLength: 10
                source:
                  type: string
      responses:
        '201':
          description: согласие сохранено (или отклонено)
          content:
            application/json:
              schema:
                type: object
                required: [message, consent]
                properties:
                  message:
                    type: string
                  consent:
                    $ref: '#/components/schemas/CookieConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: конфликт состояния согласия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cookie-consents/all:
    post:
      tags: [consents]
      operationId: setAllCookieConsents
      summary: Сохранить сразу все согласия (баннер)
      security:
        - cookieAuth: []
        - refreshCookie: []
        - guestCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    required: [consentType, isAccepted]
                    properties:
                      consentType:
                        type: string
                        enum: [technical, analytics, marketing, personalization]
                      isAccepted:
                        type: boolean
      responses:
        '201':
          description: сохранено
          content:
            application/json:
              schema:
                type: object
                required: [message, consents, expires_at]
                properties:
                  message:
                    type: string
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookieConsent'
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cookie-consents/{consentType}:
    parameters:
      - name: consentType
        in: path
        required: true
        schema:
          type: string
          enum: [technical, analytics, marketing, personalization]
    get:
      tags: [consents]
      operationId: checkCookieConsent
      summary: Проверка одного согласия
      security:
        - cookieAuth: []
        - refreshCookie: []
        - guestCookie: []
      responses:
        '200':
          description: состояние согласия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckConsentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cookie-consents/{consentType}/revoke:
    parameters:
      - name: consentType
        in: path
        required: true
        schema:
          type: string
          enum: [technical, analytics, marketing, personalization]
    put:
      tags: [consents]
      operationId: revokeCookieConsent
      summary: Отзыв согласия
      description: Требует авторизации. Создаёт запись об отзыве с причиной (`reason`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: согласие отозвано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: активное согласие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cookie-consents/link:
    post:
      tags: [consents]
      operationId: linkGuestConsents
      summary: Привязка гостевых согласий к аккаунту
      responses:
        '200':
          description: привязано
          content:
            application/json:
              schema:
                type: object
                required: [message, count]
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        '400':
          description: отсутствует guest_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: гостевые согласия не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/system/visit:
    post:
      tags: [system]
      operationId: trackVisit
      summary: Учёт посещения (аналитика)
      description: |
        Вызывается фронтом один раз на загрузку страницы и только при согласии на аналитику.
        Одна строка на посетителя в сутки, `views` инкрементируется; IP не сохраняется.
        Лимит — 180 запросов в час с IP.

        Необязательный `utm` (F03) сохраняется в `site_visit_days.utm_source/medium/campaign`:
        значения чистятся (≤ 120 символов, без control-символов и HTML), обновление идёт
        через `COALESCE(EXCLUDED.utm_*, site_visit_days.utm_*)` — первый непустой набор
        меток сохраняется. Старый формат тела без `utm` продолжает работать.
      security:
        - cookieAuth: []
        - refreshCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId, path]
              properties:
                visitorId:
                  type: string
                  minLength: 8
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._:-]{8,64}$'
                path:
                  type: string
                  maxLength: 300
                  pattern: '^/'
                utm:
                  type: object
                  description: 'UTM-метки захода (F03); любое поле может отсутствовать'
                  properties:
                    source:
                      type: string
                      maxLength: 120
                    medium:
                      type: string
                      maxLength: 120
                    campaign:
                      type: string
                      maxLength: 120
      responses:
        '200':
          description: посещение учтено
          content:
            application/json:
              schema:
                type: object
                required: [counted]
                properties:
                  counted:
                    type: boolean
                    const: true
                  views:
                    type: integer
        '204':
          description: внутренняя ошибка записи (ответ без тела)
        '400':
          description: некорректные данные (ответ без `message`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  counted:
                    type: boolean
                    const: false
        '429':
          description: "превышен лимит запросов (тело — `{counted: false}`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  counted:
                    type: boolean
                    const: false

  /api/events:
    post:
      tags: [events]
      operationId: trackProductEvents
      summary: Приём продуктовых событий (F01)
      description: |
        Публичный батч-эндпоинт событийной аналитики. Принимает до 20 событий за
        запрос; `created_at` ставит сервер (`now()`), `user_id` берётся из сессии
        при наличии авторизации, `referrer_host` — из заголовка `Referer`.
        `visitorId` — анонимный идентификатор с фронтенда (тот же формат, что и
        в `POST /api/system/visit`).

        Allowlist: `landing_view`, `register`, `plant_created`, `watering_marked`,
        `push_subscribed`, `chat_message`, `photo_added`, `plant_id_started`,
        `plant_id_success`, `share_clicked`.

        `props` — плоский объект примитивов (string/number/boolean/null), JSON не
        больше 2048 байт, без ключей `email`/`phone`/`name`/`password`/`token` (и их
        вариаций). `path` начинается с `/` и не длиннее 300 символов. Если хотя бы
        одно событие в батче некорректно, отклоняется весь запрос (400).

        Лимит: 60 запросов в минуту в разрезе IP+`visitorId` (без visitorId — по IP).
      security:
        - cookieAuth: []
        - refreshCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventsRequest'
      responses:
        '202':
          description: 'батч принят (в том числе пустой — accepted: 0)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEventsAccepted'
        '400':
          description: некорректный батч событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/garden/share:
    get:
      tags: [garden]
      operationId: getGardenShare
      summary: Текущая ссылка на сад со статистикой
      description: |
        Возвращает активную (не отозванную) ссылку шаринга текущего пользователя или
        `share: null`, если ссылки нет. `viewCount` — просмотры публичной страницы,
        `signupCount` — регистрации, атрибутированные этой ссылке. Ответ не кешируется
        (`Cache-Control: no-store`). Лимит чтения: 60 запросов в минуту на пользователя.
      security:
        - cookieAuth: []
        - refreshCookie: []
      responses:
        '200':
          description: 'статус ссылки (`share: null`, если активной ссылки нет)'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenShareStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [garden]
      operationId: createGardenShare
      summary: Создать ссылку на сад (идемпотентно)
      description: |
        Создаёт новую активную ссылку на сад, если у пользователя её нет; повторный
        вызов возвращает текущую ссылку — токен не меняется. Активная ссылка у
        пользователя всегда одна: в БД это гарантирует частичный
        `UNIQUE(user_id) WHERE revoked_at IS NULL`, поэтому конкурентные запросы
        получают `200` с одной и той же ссылкой (не `409`). Токен — 16 случайных
        байт в base64url (формат `^[A-Za-z0-9_-]{16,64}$`). Ответ не кешируется
        (`Cache-Control: no-store`). Лимит: 30 запросов в минуту на пользователя.
      security:
        - cookieAuth: []
        - refreshCookie: []
      responses:
        '200':
          description: активная ссылка на сад
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenShareStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [garden]
      operationId: revokeGardenShare
      summary: Отозвать ссылку на сад
      description: |
        Помечает активные ссылки пользователя отозванными (`revoked_at`); публичная
        страница после этого отвечает `404`. Операция идемпотентна: повторный вызов
        возвращает тот же `200`, а не ошибку. Лимит: 30 запросов в минуту на
        пользователя.
      security:
        - cookieAuth: []
        - refreshCookie: []
      responses:
        '200':
          description: ссылка отозвана (или уже была отозвана)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenShareRevoked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/garden/{token}:
    get:
      tags: [garden]
      operationId: getPublicGarden
      summary: Публичный сад по ссылке шаринга
      description: |
        Публичный просмотр сада по токену из ссылки `/garden/<token>` — без
        аутентификации. Отдаются только безопасные данные: имя владельца, количество
        активных растений и до 100 активных растений (`is_active`, порядок
        `created_at` ASC). Email, `user_id`, телефон и фотографии не возвращаются.
        `ownerName` — первый токен `users.name`, иначе `username`, иначе «Садовод».
        Каждый успешный вызов увеличивает `view_count` и `last_viewed_at`.

        Токен неверного формата, неизвестный или отозванный токен дают одинаковый
        `404`, чтобы не подсказывать формат ссылки. Ответы не кешируются
        (`Cache-Control: no-store`). Лимит: 120 запросов в минуту с IP.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]{16,64}$'
      responses:
        '200':
          description: публичный сад
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGarden'
        '404':
          description: 'токен невалиден, неизвестен или ссылка отозвана'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    example:
                      message: 'Сад не найден или ссылка отозвана'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/system/metrics:
    get:
      tags: [admin, system]
      operationId: getHttpMetrics
      summary: HTTP-метрики процесса (админ)
      description: |
        Счётчики процесса с момента старта: `total`, `byStatus`, `byMethod`,
        `latencyBuckets`, `routes` (маршруты с числовыми сегментами нормализуются в `:id`).
        Не сохраняются между перезапусками, не являются Prometheus-эндпоинтом.
      responses:
        '200':
          description: метрики
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  startedAt:
                    type: string
                    format: date-time
                  total:
                    type: integer
                  byStatus:
                    type: object
                    additionalProperties:
                      type: integer
                  byMethod:
                    type: object
                    additionalProperties:
                      type: integer
                  latencyBuckets:
                    type: array
                    items:
                      type: integer
                  routes:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/system/docker-stats:
    get:
      tags: [admin]
      operationId: getDockerStats
      summary: Телеметрия контейнеров (админ)
      description: |
        Требует `DOCKER_HOST` и `DOCKER_STATS_ENABLED != false`; данные кэшируются на 3 секунды.
        В Kubernetes (`DOCKER_STATS_ENABLED=false`) отвечает `503` с `reason=disabled`.
        Для контейнеров не в состоянии `running` `stats()` не запрашивается: `statsAvailable=false`,
        а `cpu`/`memory`/`network`/`block`/`pids` равны `null`.
        `problem` — человекочитаемая причина проблемы на русском, `problemLevel` — её уровень.
      responses:
        '200':
          description: статистика контейнеров
          content:
            application/json:
              schema:
                type: object
                required: [timestamp, summary, containers]
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  summary:
                    $ref: '#/components/schemas/DockerStatsSummary'
                  containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/DockerContainerStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Docker недоступен или статистика выключена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerUnavailableResponse'
        '500':
          description: ошибка получения статистики
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/system/docker-stats/{id}/logs:
    get:
      tags: [admin]
      operationId: getDockerContainerLogs
      summary: Логи контейнера (админ)
      description: |
        Возвращает stdout+stderr контейнера (`docker logs`) без timestamps.
        Идентификатор — 12–64 hex-символа; `tail` — 1..200 (по умолчанию 100).
        Multiplex-поток демультиплексируется, ANSI-escape удаляются, ответ обрезается до 20 000 символов.
        При недоступном Docker отвечает `503` со структурной причиной, при отсутствии контейнера — `404`.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор контейнера (12–64 hex-символа)
          schema:
            type: string
            pattern: '^[a-f0-9]{12,64}$'
        - name: tail
          in: query
          required: false
          description: Количество последних строк (1..200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: логи контейнера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: контейнер не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: ошибка чтения логов (в том числе таймаут 5 с)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '503':
          description: Docker недоступен или статистика выключена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerUnavailableResponse'

  /api/admin/analytics/overview:
