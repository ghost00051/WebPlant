          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bots:
    get:
      tags: [bots]
      summary: Каналы мессенджеров пользователя
      description: Статус привязки Telegram/MAX, ник бота и настройки доставки. Требует cookie-сессии.
      operationId: getBotChannels
      responses:
        '200':
          description: Каналы и их состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotChannelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bots/link-code:
    post:
      tags: [bots]
      summary: Одноразовый код привязки мессенджера
      description: Создаёт код с TTL (по умолчанию 15 минут) и deep link для Telegram/MAX. Лимит — 10 запросов в час на пользователя.
      operationId: createBotLinkCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [telegram, max]
      responses:
        '200':
          description: Код и deep link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotLinkCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: канал не настроен на сервере (нет токена/секрета или бот недоступен)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bots/unlink:
    post:
      tags: [bots]
      summary: Отвязать мессенджер
      operationId: unlinkBotChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [telegram, max]
      responses:
        '200':
          description: Канал отвязан
          content:
            application/json:
              schema:
                type: object
                required: [channel, linked]
                properties:
                  channel:
                    type: string
                    enum: [telegram, max]
                  linked:
                    type: boolean
                    const: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bots/preferences:
    patch:
      tags: [bots]
      summary: Включить или выключить доставку в канал
      operationId: updateBotChannelPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, notificationsEnabled]
              properties:
                channel:
                  type: string
                  enum: [telegram, max]
                notificationsEnabled:
                  type: boolean
      responses:
        '200':
          description: Настройка применена
          content:
            application/json:
              schema:
                type: object
                required: [channel, notificationsEnabled]
                properties:
                  channel:
                    type: string
                    enum: [telegram, max]
                  notificationsEnabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bots/telegram/webhook:
    post:
      tags: [bots]
      summary: Вебхук Telegram Bot API
      description: Публичный endpoint платформы; авторизация — заголовок `X-Telegram-Bot-Api-Secret-Token`. Всегда быстро возвращает 200, обработка — асинхронно, дедуп по `update_id`.
      operationId: telegramBotWebhook
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Обновление принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: неверный секрет вебхука
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: вебхук не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/bots/max/webhook:
    post:
      tags: [bots]
      summary: Вебхук MAX Bot API
      description: Публичный endpoint платформы; авторизация — заголовок `X-Max-Bot-Api-Secret`. Отвечает 200 до обработки (требование MAX ≤30 с), дедуп по `marker`/id события.
      operationId: maxBotWebhook
      security: []
      parameters:
        - name: X-Max-Bot-Api-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Обновление принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '401':
          description: неверный секрет вебхука
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '503':
          description: вебхук не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/users/me/care-streak:
    get:
      tags: [notifications]
      summary: Серия ухода и статистика недели (F10)
      description: |
        Текущая серия «поливов вовремя» (вовремя = hours_late ≤ 24), личный рекорд,
        статистика текущей локальной недели и последний weekly recap.

        INT-03: `freeze` дополнительно отдаёт `available`, `canFreeze`, `used` (boolean),
        `usedFreezes` (массив; раньше назывался `used`), `frozenDates` (`used[].localDate`)
        и `daysLeft`. В корне есть `breakReason` = `streakBreak.reason` или пустая строка;
        старые поля `enabled/perWeek/weekStart/usedThisWeek/availableThisWeek/usedTotal`
        сохранены.
      operationId: getCareStreak
      responses:
        '200':
          description: Серия, неделя и последний recap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareStreakResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/bots/analytics:
    get:
      tags: [admin, bots]
      summary: Метрики ботов и recap (только ADMIN)
      description: Подключения, доставки и ошибки по каналам и дням, конверсия link-кодов, доля напоминаний в мессенджерах, метрики weekly recap и серии. При отсутствии таблиц возвращает `tablesReady:false` и нули.
      operationId: getAdminBotAnalytics
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Метрики ботов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBotAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT сессии или access-токен (httpOnly, Secure, SameSite=None)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "JWT обновления (30 дней), только при `rememberMe: true`"
    guestCookie:
      type: apiKey
      in: cookie
      name: guest_token
      description: Подписанный HMAC гостевой идентификатор

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25

  responses:
    BadRequest:
      description: некорректный запрос (валидация)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: доступ запрещён (нет роли ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ForbiddenOrigin:
      description: запрос с недопустимого origin или без Origin при cookie-сессии
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    PayloadTooLarge:
      description: тело запроса или файл больше допустимого размера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    UnsupportedMediaType:
      description: недопустимый Content-Type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    TooManyRequests:
      description: превышен лимит запросов (rate-limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServiceUnavailable:
      description: зависимость недоступна (ИИ, SMTP, push) или исчерпан бюджет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ServerError:
      description: внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ProductEventInput:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum:
            - landing_view
            - register
            - plant_created
            - watering_marked
            - push_subscribed
            - chat_message
            - photo_added
            - plant_id_started
            - plant_id_success
            - share_clicked
        props:
          type: object
          additionalProperties:
            type: [string, number, boolean, 'null']
          description: |
            Плоский объект примитивов. JSON не больше 2048 байт. Запрещены ключи
            `email`, `phone`, `name`, `password`, `token` и их вариации
            (`user_email`, `userEmail`, `auth_token` и т.п.).
        path:
          type: string
          maxLength: 300
          pattern: '^/'

    ProductEventsRequest:
      type: object
      required: [events]
      properties:
        visitorId:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]{8,64}$'
        events:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ProductEventInput'

    ProductEventsAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
          maximum: 20

    NotificationClickResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    UtmSource:
      type: object
      required: [source, medium, campaign, visitors]
      properties:
        source:
          type: string
        medium:
          type: [string, 'null']
        campaign:
          type: [string, 'null']
        visitors:
          type: integer
          minimum: 0
          description: 'Число строк site_visit_days с этой комбинацией UTM за период'

    ProductAnalyticsResponse:
      type: object
      required: [generatedAt, timezone, days, eventsTracked, usersCreatedAtTracked, activity, funnel, retention, events, push, metrics]
      properties:
        generatedAt:
          type: string
          format: date-time
        timezone:
          type: string
          description: 'IANA-пояс расчёта (Europe/Moscow)'
        days:
          type: integer
          minimum: 1
          maximum: 365
        eventsTracked:
          type: boolean
          description: 'false, если таблицы product_events нет: activity/retention/events нулевые или пустые'
        usersCreatedAtTracked:
          type: boolean
        activity:
          type: object
          required: [dau, wau, mau, activeUsers, newUsers, eventsToday, eventsInRange]
          properties:
            dau:
              type: integer
              minimum: 0
            wau:
              type: integer
              minimum: 0
            mau:
              type: integer
              minimum: 0
            activeUsers:
              type: integer
              minimum: 0
            newUsers:
              type: integer
              minimum: 0
            eventsToday:
              type: integer
              minimum: 0
            eventsInRange:
              type: integer
              minimum: 0
        funnel:
          type: object
          required: [registered, plantCreated, wateringMarked, pushSubscribed, rates]
          properties:
            registered:
              type: integer
              minimum: 0
              description: 'users.created_at в периоде, role ≠ ADMIN'
            plantCreated:
              type: integer
              minimum: 0
              description: 'distinct plants.user_id за plants.created_at в периоде'
            wateringMarked:
              type: integer
              minimum: 0
              description: 'distinct watering_logs.user_id (action=watered) в периоде'
            pushSubscribed:
              type: integer
              minimum: 0
              description: 'distinct push_subscriptions.user_id за created_at в периоде'
            rates:
              type: object
              required: [plantCreated, wateringMarked, pushSubscribed]
              properties:
                plantCreated:
                  type: number
                  description: 'процент от registered, 1 знак'
                wateringMarked:
                  type: number
                pushSubscribed:
                  type: number
        retention:
          type: array
          description: 'До 8 последних недельных когорт, от новых к старым; когорты с size=0 отброшены'
          items:
            type: object
            required: [cohort, cohortLabel, size, d1, d7, d30, d1Rate, d7Rate, d30Rate]
            properties:
              cohort:
                type: string
                format: date
                description: 'Начало недели когорты (понедельник, МСК)'
              cohortLabel:
                type: string
                pattern: '^[0-9]{2}\.[0-9]{2}$'
                description: 'DD.MM начала недели'
              size:
                type: integer
                minimum: 0
              d1:
                type: integer
                minimum: 0
              d7:
                type: integer
                minimum: 0
              d30:
                type: integer
                minimum: 0
              d1Rate:
                type: number
              d7Rate:
                type: number
              d30Rate:
                type: number
        events:
          type: array
          description: 'Топ-10 событий за период; пустой массив, если product_events нет'
          items:
            type: object
            required: [event, count, users]
            properties:
              event:
                type: string
              count:
                type: integer
                minimum: 0
              users:
                type: integer
                minimum: 0
                description: 'distinct user_id'
        push:
          type: object
          required: [notifications, clicks, ctr, clickedToday]
          properties:
            notifications:
              type: integer
              minimum: 0
            clicks:
              type: integer
              minimum: 0
              description: 'SUM(click_count) по уведомлениям за период'
            ctr:
              type: number
              description: 'clicks / notifications * 100, 1 знак'
            clickedToday:
              type: integer
              minimum: 0
              description: 'count(clicked_at за сегодня, МСК)'
        metrics:
          $ref: '#/components/schemas/ProductMetrics'

    ProductMetrics:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          minItems: 12
          maxItems: 12
          description: '12 метрик в фиксированном порядке: ttfv, activation, plants2, d1, d7, d30, push_ctr, returns_no_push, ai_usage, ai_cost, premium, share_organic'
          items:
            $ref: '#/components/schemas/ProductMetricItem'
        summary:
          $ref: '#/components/schemas/ProductMetricsSummary'

    ProductMetricsSummary:
      type: object
      required: [total, measured, partial, unavailable]
      properties:
        total:
          type: integer
          const: 12
        measured:
          type: integer
          minimum: 0
          description: 'Метрики со статусом measured'
        partial:
          type: integer
          minimum: 0
          description: 'Метрики со статусом partial'
        unavailable:
          type: integer
          minimum: 0
          description: 'Метрики со статусом unavailable'

    ProductMetricItem:
      type: object
      required: [id, label, priority, horizon, target, status, value, unit, display, detail, source, targetMet]
      properties:
        id:
          type: string
          enum: [ttfv, activation, plants2, d1, d7, d30, push_ctr, returns_no_push, ai_usage, ai_cost, premium, share_organic]
          description: 'Идентификатор метрики из листа «Метрики»'
        label:
          type: string
          description: 'Название строго из листа «Метрики»'
        priority:
          type: string
          enum: [P0, P1, P2]
        horizon:
          type: string
          description: 'Горизонт достижения цели'
        target:
          type: string
          description: 'Целевое значение в человекочитаемом виде'
        status:
          type: string
          enum: [measured, partial, unavailable]
          description: 'measured — считается по данным; partial — считается частично (нет тарифа/телеметрии/биллинга/миграции шаринга или данных); unavailable — нет источника'
        value:
          type: [number, 'null']
          description: 'Значение в единицах unit; null, если метрика недоступна или нет данных'
        unit:
          type: string
          enum: [seconds, percent, rub]
        display:
          type: string
          description: 'Готовое к показу значение: «142 с», «38,9%», «2,1 ₽»; «—» при отсутствии данных'
        detail:
          type: string
          description: 'Короткая методика/ограничение, например «медиана; n=42; 41% ≤ 60 с»'
        source:
          type: string
          description: 'Источник данных из листа «Метрики»'
        targetMet:
          type: [boolean, 'null']
          description: 'Достигнута ли цель; null, если значение неизвестно'

    GardenShare:
      type: object
      required: [token, path, createdAt, viewCount, signupCount]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{16,64}$'
          description: 'Случайный токен ссылки (16 random bytes в base64url)'
        path:
          type: string
          description: 'Путь публичной страницы на фронтенде: `/garden/<token>`'
        createdAt:
          type: [string, 'null']
          format: date-time
          description: 'Когда ссылка создана'
        viewCount:
          type: integer
          minimum: 0
          description: 'Просмотры публичной страницы сада'
        signupCount:
          type: integer
          minimum: 0
          description: 'Регистрации, атрибутированные этой ссылке'

    GardenShareStatus:
      type: object
      required: [share]
      properties:
        share:
          oneOf:
            - $ref: '#/components/schemas/GardenShare'
            - type: 'null'
          description: 'Активная (не отозванная) ссылка; null, если ссылки нет'

    GardenShareRevoked:
      type: object
      required: [share, revoked]
      properties:
        share:
          type: 'null'
          description: 'После отзыва активной ссылки нет'
        revoked:
          type: boolean
          const: true

    PublicGardenPlant:
      type: object
      required: [id, name, species, intervalDays]
      properties:
        id:
          type: integer
        name:
          type: string
        species:
          type: [string, 'null']
        intervalDays:
          type: [integer, 'null']
          description: 'Интервал полива в днях (`watering_interval_days`)'

    PublicGarden:
      type: object
      required: [garden]
      properties:
        garden:
          type: object
          required: [token, ownerName, plantCount, plants, sharedAt, viewCount]
          properties:
            token:
              type: string
              pattern: '^[A-Za-z0-9_-]{16,64}$'
            ownerName:
              type: string
              description: 'Первый токен users.name, иначе username, иначе «Садовод»'
            plantCount:
              type: integer
              minimum: 0
              description: 'Всего активных растений; в plants — не больше 100'
            plants:
              type: array
              maxItems: 100
              description: 'Активные растения (is_active), порядок created_at ASC'
              items:
                $ref: '#/components/schemas/PublicGardenPlant'
            sharedAt:
              type: [string, 'null']
              format: date-time
              description: 'Когда ссылка создана'
            viewCount:
              type: integer
              minimum: 0
              description: 'Просмотры после инкремента текущего вызова'

    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
        deployTarget:
          type: [string, 'null']
          enum: [compose, kubernetes, null]
        redis:
          type: string
          enum: [ok, unavailable, disabled]
        mail:
          type: string
          description: 'например `ok`, `not-configured`'
        push:
          type: object
          additionalProperties: true
          description: статус конфигурации VAPID (`configured`, `valid`, `error`)
        backgroundJobs:
          type: boolean
        aiCache:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        phone:
          type: [string, 'null']
          maxLength: 20
        bio:
          type: [string, 'null']
          maxLength: 300
        role:
          type: string
          enum: [USER, ADMIN]
        privilege_level:
          type: string
          enum: [free, premium, pro]
        timezone:
          type: [string, 'null']
          description: IANA-пояс (по умолчанию Europe/Moscow)
        marketing_email_opt_in:
          type: boolean
          description: согласие на маркетинговые письма (по умолчанию false)
        created_at:
          type: string
          format: date-time
          description: есть в админ-выборках; в `/api/users/me` не возвращается

    RegistrationRequest:
      type: object
      required: [email, password, privacyPolicyAccepted, termsAccepted]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: требования проверяются `isValidRegistrationPassword` (не короче 8 символов)
        name:
          type: string
          maxLength: 100
        username:
          type: string
          maxLength: 30
          description: '3–30 символов: латиница, цифры, `.`, `_`'
        privacyPolicyAccepted:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
        rememberMe:
          type: boolean
        timezone:
          type: string
        marketingConsent:
          type: boolean
          description: отдельное (необязательное) согласие на маркетинговые письма
        shareToken:
          type: string
          minLength: 16
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{16,64}$'
          description: |
            Необязательный токен публичной ссылки на сад (F13, из `/garden/<token>`):
            регистрация атрибутируется к шарингу (`garden_share_signups`). Неверный
            формат — `400`; неизвестный или отозванный токен молча игнорируется и не
            мешает регистрации.

    RegistrationResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        guestLink:
          $ref: '#/components/schemas/GuestLinkSummary'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 1024
        rememberMe:
          type: boolean

    LoginResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        guestLink:
          $ref: '#/components/schemas/GuestLinkSummary'

    GuestLinkSummary:
      type: object
      description: |
        Результат переноса гостевых данных (F09) при регистрации/входе. Поле всегда
        присутствует в новых ответах; `linked` = `chatMessages + consents > 0`. Счётчики
        отражают только реально перенесённые записи: при частичном сбое линковки ошибки
        не ломают регистрацию/вход, но и не считаются перенесёнными.
      required: [linked, chatMessages, chatSessions, diagnoses, consents]
      properties:
        linked:
          type: boolean
        chatMessages:
          type: integer
          minimum: 0
        chatSessions:
          type: integer
          minimum: 0
        diagnoses:
          type: integer
          minimum: 0
        consents:
          type: integer
          minimum: 0

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 100
        username:
          type: [string, 'null']
          maxLength: 30
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        bio:
          type: [string, 'null']
          maxLength: 300
        timezone:
          type: [string, 'null']

    CheckUsernameResponse:
      type: object
      properties:
        available:
          type: boolean
        username:
          type: string
        message:
          type: string

    DeleteAccountResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true
        removed:
          type: object
          additionalProperties: true
          description: 'счётчики удалённых записей: plants, photos, waterings, chatMessages, pushSubscriptions, notifications, legalConsents, cookieConsents, sessions, passkeys, photoFiles'

    AccountExport:
      type: object
      required: [format, formatVersion, exportedAt, account]
      properties:
        format:
          type: string
          const: webplant-account-export
        formatVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        account:
          type: object
          additionalProperties: true
          description: 'санитизированный профиль: id, email, name, username, phone, bio, role, privilegeLevel, timezone'
        plants:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'растение с `carePlan` и массивом `photos`'
        wateringLogs:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, plantId, action, wateredAt, scheduledFor, hoursLate, daysLate, comment, metadata]
            description: 'отметки полива: `wateredAt` = `watering_logs.action_at`, `hoursLate` = `hours_late`, `daysLate` = floor(hoursLate / 24), `comment` = `note`'
            properties:
              id:
                type: integer
              plantId:
                type: [integer, 'null']
              action:
                type: [string, 'null']
              wateredAt:
                type: [string, 'null']
                format: date-time
              scheduledFor:
                type: [string, 'null']
                format: date-time
              hoursLate:
                type: [integer, 'null']
              daysLate:
                type: [integer, 'null']
              comment:
                type: [string, 'null']
              metadata:
                type: object
                additionalProperties: true
        chatMessages:
          type: array
          items:
            type: object
            additionalProperties: true
        aiAdvice:
          type: array
          items:
            type: object
            additionalProperties: true
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        notificationPreferences:
          type: [object, 'null']
          additionalProperties: true
        pushSubscriptions:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'хост сервиса push, даты создания/успеха/инвалидации (без ключей и endpoint)'
        consents:
          type: object
          properties:
            cookie:
              type: array
              items:
                type: object
                additionalProperties: true
            legal:
              type: array
              items:
                type: object
                additionalProperties: true
        passkeys:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'deviceName, createdAt, lastUsedAt, transports (без credential/public key)'
        sessions:
          type: object
          properties:
            authSessions:
              type: integer
        siteVisits:
          type: array
          items:
            type: object
            additionalProperties: true

    NotificationPreferences:
      type: object
      required: [morning_summary_enabled, care_advice_enabled, dark_theme_enabled, theme_mode]
      properties:
        morning_summary_enabled:
          type: boolean
        care_advice_enabled:
          type: boolean
        weekly_recap_enabled:
          type: boolean
          description: 'F10: присылать недельный recap (по умолчанию true)'
        dark_theme_enabled:
          type: boolean
        theme_mode:
          type: string
          enum: [system, light, dark]
        delivery_mode:
          type: string
          enum: [digest, per_plant]
          description: 'F41: digest по умолчанию — одна сводка вместо N сообщений'
        quiet_hours_enabled:
          type: boolean
          description: 'F43: тихие часы включены'
        quiet_hours_start:
          type: string
          example: '22:00'
        quiet_hours_end:
          type: string
          example: '08:00'
        quiet_hours_timezone:
          type: string
          description: read-only; часовой пояс пользователя для границ тихих часов

    PlantWateringState:
      type: object
      description: |
        F14: объяснимое состояние полива. overdue=true — слот уже в прошлом относительно
        локальной полуночи следующего дня (та же семантика, что `is_missed` в
        `/api/plants/schedule`), поэтому для просроченного растения status никогда не
        бывает `scheduled`. missed=true — календарная просрочка (status=missed), т.е.
        наступает уже при overdue; `missed_since`/`grace_hours` описывают окно, в котором
        авто-пропуск ещё не подтверждён, а `can_backfill` — можно ли отметить полив за
        прошедший слот. В режиме preserve план не сдвигается автоматически.
      required: [status, policy, overdue, missed, can_backfill]
      properties:
        status:
          type: string
          enum: [scheduled, due_today, missed, paused]
        policy:
          type: string
          enum: [preserve, auto_skip]
        scheduled_for:
          type: [string, 'null']
          format: date-time
          description: текущий запланированный слот (next_watering_at)
        overdue:
          type: boolean
          description: 'BE-07: просрочено с локальной полуночи (true → status=missed)'
        missed:
          type: boolean
        missed_since:
          type: [string, 'null']
          format: date-time
          description: первый неполитый слот
        missed_slots:
          type: integer
          minimum: 0
        hours_late:
          type: integer
          minimum: 0
        days_late:
          type: integer
          minimum: 0
        can_backfill:
          type: boolean
          description: можно ли ещё отметить пропуск как «полил позже»
        backfill_until:
          type: [string, 'null']
          format: date-time
          description: до какого момента доступен backfill (30 дней от слота)
        reason:
          type: [string, 'null']
          enum: [missed_slot, auto_skipped, reminders_paused, null]
        grace_hours:
          type: integer
          minimum: 0
          description: 'BE-07: окно подтверждения пропуска, после которого растёт missed_slots (24 ч)'
        consecutive_skips:
          type: integer
          minimum: 0
        reminders_paused:
          type: boolean
        timezone:
          type: string

    PasskeyCreationOptions:
      type: object
      required: [_key]
      additionalProperties: true
      description: Параметры `generateRegistrationOptions` + служебный `_key` для завершения
      properties:
        _key:
          type: string
          maxLength: 120
        challenge:
          type: string

    PasskeyRequestOptions:
      type: object
      required: [_key]
      additionalProperties: true
      description: Параметры `generateAuthenticationOptions` + служебный `_key`
      properties:
        _key:
          type: string
          maxLength: 120

    PasskeySummary:
      type: object
      properties:
        id:
          type: integer
        device_name:
          type: [string, 'null']
        transports:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time

    Plant:
      type: object
      required: [id, user_id, name]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
          maxLength: 255
        species:
          type: [string, 'null']
          maxLength: 255
        location:
          type: [string, 'null']
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 10000
        watering_interval_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
        watering_time_of_day:
          type: [string, 'null']
          enum: [morning, day, evening]
        last_watered_at:
          type: [string, 'null']
          format: date-time
        next_watering_at:
          type: [string, 'null']
          format: date-time
        is_active:
          type: boolean
        notify_morning:
          type: boolean
        notify_day_before:
          type: boolean
        reminder_weekdays:
          type: array
          items:
            type: integer
        metadata:
          type: object
          additionalProperties: true
          description: 'в т.ч. `prediction` (адаптивная модель), `notifications` (прогресс напоминаний) и `health_check` (последняя проверка здоровья: text/diagnosis/photoUrl/createdAt)'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PlantPhoto'
        watering_state:
          $ref: '#/components/schemas/PlantWateringState'
          description: 'F14: пропущен ли полив и что можно сделать (аддитивное поле)'

    PlantPhoto:
      type: object
      required: [id, plant_id, url]
      properties:
        id:
          type: integer
        plant_id:
          type: integer
        url:
          type: string
          maxLength: 2048
        sort_order:
          type: integer
          minimum: 0
        is_main:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
          description: 'может содержать diagnosis (структура разбора ИИ) и diagnosis_text (текстовый разбор)'
        thumb_url:
          type: [string, 'null']
          description: 'F30: миниатюра 160x160 (если sharp доступен)'
        taken_at:
          type: [string, 'null']
          format: date-time
          description: 'F30: дата съёмки роста; у старых фото null — клиент берёт created_at'
        note:
          type: [string, 'null']
          maxLength: 500
          description: 'F30: заметка к фото роста'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlantHealthCheck:
      type: object
      description: 'INT-01/INT-04: результат проверки здоровья по фото, сохранённый на сервере.'
      required: [text, diagnosis, photoUrl, createdAt, saved]
      properties:
        text:
          type: string
          description: текстовый разбор (formatPlantDiagnosisText)
        diagnosis:
          type: [object, 'null']
          additionalProperties: true
          description: 'структура разбора ИИ (isPlant, plantName, visibleSymptoms, likelyProblems, severity, careAdvice, photoQuality, needsAnotherPhoto, summary); isPlant=false, если на фото не растение'
        photoUrl:
          type: string
          description: URL проверенного фото; пустая строка для multipart (файл не сохраняется)
        createdAt:
          type: string
          format: date-time
        saved:
          type: boolean
          const: true

    PhotoInput:
      oneOf:
        - type: string
          maxLength: 2048
          description: '/uploads/plants/<32hex>.<ext>'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              maxLength: 2048
            sort_order:
              type: integer
              minimum: 0
            is_main:
              type: boolean
            metadata:
              type: object
              additionalProperties: true
            taken_at:
              type: string
              format: date-time
              description: 'F30: когда сделан снимок (необязательно)'
            note:
              type: string
              maxLength: 500
              description: 'F30: заметка к фото роста'

    PopularPlantSpecies:
      type: object
      required: [species, addedCount, usersCount]
      properties:
        species:
          type: string
          maxLength: 160
          description: Вид растения так, как его сохранили пользователи (обычно латынь).
