version: 2

updates:
  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(backend)
    groups:
      backend-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(frontend)
    groups:
      frontend-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(docker)
