name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Проверка боевых эндпоинтов
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://checktheplants.ru' }}
      API_URL: ${{ vars.API_URL || 'https://server.checktheplants.ru' }}
    steps:
      - name: /health (API + БД)
        id: health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$API_URL/health")"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: /livez (liveness)
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$API_URL/livez" | grep -q '"status":"ok"'

      - name: Главная страница и robots.txt
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 -o /dev/null "$SITE_URL/"
          curl -fsS --max-time 10 "$SITE_URL/robots.txt" | grep -q 'User-agent'

      - name: Защищённый API отвечает 401 без cookie (а не 5xx)
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API_URL/api/plants")"
          echo "GET /api/plants -> $code"
          test "$code" = "401"

      - name: Создать issue при сбое
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Uptime: проверка не прошла (${new Date().toISOString().slice(0, 16)})`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `Внешняя проверка боевых эндпоинтов упала.`,
              ``,
              `- Сайт: ${{ env.SITE_URL }}`,
              `- API: ${{ env.API_URL }}`,
              `- Запуск: ${runUrl}`
            ].join('\n')

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 1
            })

            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uptime']
              })
            }
