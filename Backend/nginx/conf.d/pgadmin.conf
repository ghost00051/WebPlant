limit_req_zone $binary_remote_addr zone=pgadmin_login:10m rate=12r/m;
limit_req_status 429;

server {
    listen 80;
    server_name pgadmin.checktheplants.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
