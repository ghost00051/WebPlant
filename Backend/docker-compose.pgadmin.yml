services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ctp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pgadmin_net
      # Сеть кластера kind: нужна, чтобы pgAdmin видел боевую базу в кластере
      # (сервис postgres-nodeport, nodePort 30432). K8s ClusterIP из docker-сетей
      # недостижим, поэтому ходим на IP ноды — как это делает ctp_k8s_gateway.
      - kind

volumes:
  pgadmin_data:

networks:
  pgadmin_net:
    external: true
    name: backend_pgadmin_net
  kind:
    external: true
    name: kind
