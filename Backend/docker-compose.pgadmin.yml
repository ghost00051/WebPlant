services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ctp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_BIND_ADDRESS:-0.0.0.0}:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ctp_network          

volumes:
  pgadmin_data:

networks:
  ctp_network:
    external: true
    name: backend_ctp_network 