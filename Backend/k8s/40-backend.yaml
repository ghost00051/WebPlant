apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  type: ClusterIP
  selector:
    app: webplant-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---

apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  type: NodePort
  selector:
    app: webplant-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: webplant-backend
  template:
    metadata:
      labels:
        app: webplant-backend
    spec:
      serviceAccountName: webplant-backend
      # Токен ServiceAccount нужен для чтения подов namespace в админке (Role в 05-serviceaccount.yaml).
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: webplant-backend:__TAG__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: webplant-config
            - configMapRef:
                name: webplant-env
            - secretRef:
                name: webplant-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          # Пробы терпимы к просадке диска/CPU: deploy.ps1 раскладывает ~135-МБ образ на
          # все ноды, и WSL2 на это время отвечает медленнее, чем 5 с. /health делает
          # roundtrip в PostgreSQL, поэтому 5 с давали ложные NotReady (2026-10-22).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: webplant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webplant-backend
