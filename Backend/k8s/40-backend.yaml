apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  type: ClusterIP
  selector:
    app: webplant-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---

apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  type: NodePort
  selector:
    app: webplant-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webplant
  labels:
    app: webplant-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: webplant-backend
  template:
    metadata:
      labels:
        app: webplant-backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: webplant-backend:__TAG__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: webplant-config
            - configMapRef:
                name: webplant-env
            - secretRef:
                name: webplant-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: webplant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webplant-backend
