apiVersion: v1
kind: ConfigMap
metadata:
  name: webplant-config
  namespace: webplant
  labels:
    app.kubernetes.io/name: webplant
  annotations:
    webplant.io/background-jobs-safety: >-
      BACKGROUND_JOBS_ENABLED=true is safe with more than one backend replica: every cron
      entry point runs inside withDistributedLock (Backend/utils/distributedLock.js), a Redis
      SET NX PX lock with a per-instance token, token-checked Lua release and TTL renewal
      while the task runs. Lock keys: job:reminder-tick (reminderService.runTick),
      job:cleanup-expired (startCleanupJob), job:push-broadcast (startPushBroadcastJob) and
      job:morning-summary:<userId>:<date> per user and day. All replicas share the cluster
      Redis service redis:6379 (30-redis.yaml), so exactly one replica acts per tick.
      Boundaries: single execution holds only while Redis is reachable - acquireLock degrades
      to acquire-always when Redis is down, so then every replica runs the job; and the lock
      dedupes replicas of this cluster only, not a separate compose stack with its own Redis.
      deploy.ps1 patches this key right after kubectl apply (k8s/scripts/deploy.ps1), so the
      cluster value must be confirmed afterwards or the deploy run with -EnableBackgroundJobs.
data:
  NODE_ENV: production
  PORT: "5000"

  DEPLOY_TARGET: kubernetes

  DB_HOST: postgres
  DB_PORT: "5432"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_KEY_PREFIX: ctp
  REDIS_CONNECT_TIMEOUT_MS: "3000"
  REDIS_COMMAND_TIMEOUT_MS: "500"
  REDIS_FAILURE_THRESHOLD: "3"
  REDIS_BREAKER_COOLDOWN_MS: "30000"


  AI_CACHE_ENABLED: "true"
  AI_CACHE_TTL_SECONDS: "604800"
  AI_CHAT_CACHE_TTL_SECONDS: "600"
  AI_DAILY_REQUEST_BUDGET: "5000"
  AI_PRICE_INPUT_PER_1K: "0.3"
  AI_PRICE_OUTPUT_PER_1K: "0.5"
  AI_PRICE_CACHED_PER_1K: "0.075"
  AI_PRICE_CURRENCY: "RUB"
  AI_CHAT_TIMEOUT_MS: "20000"
  AI_ADVICE_TIMEOUT_MS: "15000"
  AI_CHAT_DEADLINE_MS: "25000"
  AI_ADVICE_DEADLINE_MS: "30000"

  WATERING_ADVICE_MAX_QUESTIONS: "6"
  AI_CHAT_GUEST_DAILY_LIMIT: "40"
  AI_CHAT_USER_DAILY_LIMIT: "300"

  APP_TIME_ZONE: "Europe/Moscow"

  CHAT_LOG_RETENTION_DAYS: "365"
  AI_ADVICE_LOG_RETENTION_DAYS: "365"

  BACKGROUND_JOBS_ENABLED: "true"

  DOCKER_STATS_ENABLED: "false"
