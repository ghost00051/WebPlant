apiVersion: v1
kind: ServiceAccount
metadata:
  name: webplant-backend
  namespace: webplant
  labels:
    app.kubernetes.io/name: webplant-backend
    app.kubernetes.io/part-of: checktheplants
# Токен нужен админке: она читает поды namespace через API кластера (страница «Сервер»).
# Права ограничены чтением подов и их логов в одном namespace — см. Role ниже.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webplant-backend-pods
  namespace: webplant
  labels:
    app.kubernetes.io/name: webplant-backend
    app.kubernetes.io/part-of: checktheplants
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webplant-backend-pods
  namespace: webplant
  labels:
    app.kubernetes.io/name: webplant-backend
    app.kubernetes.io/part-of: checktheplants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webplant-backend-pods
subjects:
  - kind: ServiceAccount
    name: webplant-backend
    namespace: webplant
