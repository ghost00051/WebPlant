# Промежуточный (канареечный) режим: API и фото остаются на compose-стеке
# (там боевая база и боевые записи), а /health уходит в Kubernetes.
#
# Зачем: проверить связку nginx → ctp_k8s_gateway → backend в кластере на живом
# домене, не рискуя пользовательскими данными. Признак, какой стек ответил:
# в ответе /health поле backgroundJobs (true — compose, false — Kubernetes).
#
# Включается: powershell -File Backend/k8s/scripts/switch-traffic.ps1 -Target canary

server {
    listen 80;
    server_name server.checktheplants.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name server.checktheplants.ru;

    ssl_certificate /etc/letsencrypt/live/server.checktheplants.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.checktheplants.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;

    # Имена контейнеров резолвим на каждом запросе (Docker DNS), чтобы пересоздание
    # gateway или backend не требовало перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $k8s_backend "ctp_k8s_gateway:8090";

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass http://$k8s_backend/health;
        access_log off;
    }

    location / {
        return 404;
    }
}
