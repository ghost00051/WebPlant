services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: ctp_docker_socket_proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ctp_network
    expose:
      - "2375"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: ctp_postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - ctp_network
      - pgadmin_net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ctp_redis
    restart: always
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - ctp_network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: postgres:16-alpine
    container_name: ctp_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - ctp_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        if ! psql -tAc "select 1 from information_schema.tables where table_schema = 'public' and table_name = 'users'" | grep -q 1; then
          echo "В базе нет таблицы users: сначала восстановите данные (pg_restore дампа из Backend/backups), затем повторите docker compose up -d";
          exit 1;
        fi;
        for file in /migrations/*.sql; do
          echo "applying $$file";
          psql -v ON_ERROR_STOP=1 -q -f "$$file";
        done;
        echo "migrations applied";
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctp_backend
    env_file:
      - .env
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DEPLOY_TARGET: compose
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DB_POOL_MAX: 10
      APP_TIME_ZONE: Europe/Moscow
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      UNSUBSCRIBE_URL_BASE: ${UNSUBSCRIBE_URL_BASE:-https://server.checktheplants.ru/api/users/unsubscribe}
      SECRET_KEY: ${SECRET_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      FRONTEND_URL: ${FRONTEND_URL}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - ctp_network
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ctp_nginx:local
    container_name: ctp_nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - ctp_network
      - pgadmin_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: ctp_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"docker exec ctp_nginx nginx -s reload\"; sleep 12h & wait $${!}; done;'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_conf:
    name: backend_certbot_conf

networks:
  ctp_network:
    driver: bridge
  pgadmin_net:
    driver: bridge
    internal: true
    name: backend_pgadmin_net
