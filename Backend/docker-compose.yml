services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: ctp_docker_socket_proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ctp_network
    expose:
      - "2375"
  postgres:
    image: postgres:16-alpine
    container_name: ctp_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - ctp_network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctp_backend
    env_file:
      - .env   
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      FRONTEND_URL: ${FRONTEND_URL}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - ctp_network
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:16-alpine
    container_name: ctp_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads:ro
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - ctp_network
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do /bin/sh /usr/local/bin/backup.sh || echo 'Backup failed; will retry in 24 hours'; sleep 86400; done"]

  nginx:
    image: nginx:alpine
    container_name: ctp_nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - ctp_network

  certbot:
    image: certbot/certbot
    container_name: ctp_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local

networks:
  ctp_network:
    driver: bridge